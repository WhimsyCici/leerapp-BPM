/* ============================================================
   QUIZ ENGINE (gedeeld door oefentoets en tentamen)
   ============================================================ */
let activeQuiz = null; // {mode, chapterId, questions:[...with shuffled options...], answers:{}, current}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderQuizSetup(el, {mode, chapterId}) {
  if (mode === 'oefentoets') {
    const ch = chapterById(chapterId);
    el.innerHTML = `
      <div class="page-eyebrow">Hoofdstuk ${ch.number} · Oefentoets</div>
      <h2 class="page-title">Klaar om te oefenen?</h2>
      <div class="card">
        <p>Deze oefentoets bevat <strong>${ch.questions.length} meerkeuzevragen</strong> over hoofdstuk ${ch.number}, verdeeld over onthouden, begrijpen en toepassen. De volgorde van vragen en antwoorden wordt elke keer opnieuw geschud.</p>
        <label class="fb-toggle"><input type="checkbox" id="fbToggle" checked><span>Na elke vraag meteen laten zien of mijn antwoord goed of fout is, met een korte toelichting</span></label>
        <button class="btn" id="startBtn">Start oefentoets ✏️</button>
      </div>
    `;
    el.querySelector('#startBtn').onclick = () => startQuiz({mode:'oefentoets', chapterId, feedback: el.querySelector('#fbToggle').checked, questions: ch.questions.map(q=>({...q, chapterId: ch.id, chapterTitle: 'Hoofdstuk '+ch.number}))});
  } else {
    const all = allQuestions();
    el.innerHTML = `
      <div class="page-eyebrow">Tentamenmodus</div>
      <h2 class="page-title">Simuleer je tentamen</h2>
      <div class="card">
        <p>Kies welke hoofdstukken je wilt oefenen. De vragen worden elke keer in een <strong>willekeurige volgorde</strong> gezet, en ook de antwoordopties worden geschud.</p>
        <div class="setup-choice">
          ${CHAPTERS.map(c => `<label class="chapter-check fb-toggle" style="margin:6px 0;"><input type="checkbox" class="chSel" value="${c.id}" checked><span>Hoofdstuk ${c.number} — ${c.title} <span style="color:var(--ink-soft);">(${c.questions.length} vragen)</span></span></label>`).join('')}
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap; margin:8px 0 4px;">
          <button class="btn ghost" id="selAll" type="button">Alles selecteren</button>
          <button class="btn ghost" id="selNone" type="button">Niets selecteren</button>
        </div>
        <p id="qCount" style="font-weight:800; color:var(--mauve); margin-top:12px;"></p>
        <p style="font-size:13px; color:var(--ink-soft);">Tijdens het tentamen kun je met <strong>Terug</strong> en <strong>Volgende</strong> navigeren, vragen overslaan, en vóór het inleveren nog wijzigingen aanbrengen. Na afloop kun je alleen je foute vragen opnieuw maken.</p>
        <label class="fb-toggle"><input type="checkbox" id="fbToggleT" checked><span>Na elke vraag meteen laten zien of mijn antwoord goed of fout is, met een korte toelichting (zet uit voor een echte tentamensimulatie)</span></label>
        <button class="btn" id="startBtnT">Start tentamen 🎓</button>
      </div>
    `;
    const selected = () => [...el.querySelectorAll('.chSel')].filter(c => c.checked).map(c => c.value);
    const upd = () => {
      const ids = selected();
      const n = all.filter(q => ids.includes(q.chapterId)).length;
      el.querySelector('#qCount').textContent = ids.length ? `${n} vragen geselecteerd uit ${ids.length} hoofdstuk${ids.length>1?'ken':''}` : 'Selecteer minstens één hoofdstuk';
      el.querySelector('#startBtnT').disabled = !ids.length;
    };
    el.querySelectorAll('.chSel').forEach(c => c.onchange = upd);
    el.querySelector('#selAll').onclick = () => { el.querySelectorAll('.chSel').forEach(c => c.checked = true); upd(); };
    el.querySelector('#selNone').onclick = () => { el.querySelectorAll('.chSel').forEach(c => c.checked = false); upd(); };
    upd();
    el.querySelector('#startBtnT').onclick = () => {
      const ids = selected();
      startQuiz({mode:'tentamen', feedback: el.querySelector('#fbToggleT').checked, questions: all.filter(q => ids.includes(q.chapterId))});
    };
  }
}

function startQuiz({mode, chapterId, questions, feedback = true, retry = false}) {
  const shuffledQs = shuffle(questions).map(q => ({
    ...q,
    shuffledOptions: shuffle(q.options)
  }));
  activeQuiz = { mode, chapterId, questions: shuffledQs, answers: {}, current: 0, submitted:false, feedback, retry, revealed: {} };
  go({view:'quiz'});
}

function renderQuiz(el) {
  const quiz = activeQuiz;
  if (!quiz) { go({view:'dashboard'}); return; }
  const total = quiz.questions.length;
  const idx = quiz.current;
  const q = quiz.questions[idx];
  const answeredCount = Object.keys(quiz.answers).length;

  el.innerHTML = '';
  const eyebrow = document.createElement('div');
  eyebrow.className = 'page-eyebrow';
  eyebrow.textContent = (quiz.mode === 'tentamen' ? '🎓 Tentamen' : '✏️ Oefentoets — ' + (q.chapterTitle || '')) + (quiz.retry ? ' · alleen foute vragen' : '');
  el.appendChild(eyebrow);

  const progRow = document.createElement('div');
  progRow.className = 'quiz-progress-row';
  const dots = document.createElement('div');
  dots.className = 'quiz-dots';
  quiz.questions.forEach((qq, i) => {
    const d = document.createElement('div');
    const rv = quiz.feedback && quiz.revealed[qq.id] && quiz.answers[qq.id] !== undefined;
    d.className = 'qdot' + (rv ? (quiz.answers[qq.id] === qq.correct ? ' ok' : ' no') : (quiz.answers[qq.id] !== undefined ? ' answered' : '')) + (i === idx ? ' current' : '');
    dots.appendChild(d);
  });
  const counter = document.createElement('div');
  counter.style.cssText = 'font-weight:800; color:var(--mauve); font-size:14px;';
  counter.textContent = `Vraag ${idx+1} van ${total} · ${answeredCount} beantwoord`;
  progRow.appendChild(counter);
  progRow.appendChild(dots);
  el.appendChild(progRow);

  const card = document.createElement('div');
  card.className = 'question-card';

  const meta = document.createElement('div');
  meta.className = 'question-meta';
  meta.innerHTML = `<span class="badge lilac">${q.chapterTitle || ''}</span><span class="badge pink">${q.topic}</span><span class="badge good" style="background:var(--lilac-soft); color:var(--mauve);">${capitalize(q.bloom)}</span>`;
  card.appendChild(meta);

  const qtext = document.createElement('div');
  qtext.className = 'question-text';
  qtext.textContent = q.q;
  card.appendChild(qtext);

  const selected = quiz.answers[q.id];
  const revealed = !!(quiz.feedback && quiz.revealed[q.id] && selected !== undefined);
  q.shuffledOptions.forEach((opt, oi) => {
    const optEl = document.createElement('div');
    let cls = 'option' + (selected === opt.id ? ' selected' : '');
    if (revealed) cls = 'option' + (opt.id === q.correct ? ' correct' : (selected === opt.id ? ' incorrect' : ''));
    optEl.className = cls;
    if (revealed) optEl.style.cursor = 'default';
    optEl.innerHTML = `<div class="optletter">${'ABC'[oi]}</div><div>${opt.text}</div>`;
    optEl.onclick = () => {
      if (revealed) return;
      quiz.answers[q.id] = opt.id;
      render();
    };
    card.appendChild(optEl);
  });

  if (revealed) {
    const ok = selected === q.correct;
    const correctPos = q.shuffledOptions.findIndex(o => o.id === q.correct);
    const fb = document.createElement('div');
    fb.className = 'feedback-box ' + (ok ? 'ok' : 'no');
    fb.innerHTML = `<div class="fb-title">${ok ? '✅ Goed!' : '❌ Helaas, dat is niet juist.'}</div>` +
      (ok ? '' : `<div>Het juiste antwoord is <strong>${'ABC'[correctPos]}</strong>.</div>`) +
      `<div style="margin-top:4px;">${q.explanation}</div>`;
    card.appendChild(fb);
  }

  el.appendChild(card);

  const navRow = document.createElement('div');
  navRow.className = 'quiz-nav-row';
  const backBtn = document.createElement('button');
  backBtn.className = 'btn secondary';
  backBtn.textContent = '← Terug';
  backBtn.disabled = idx === 0;
  backBtn.onclick = () => { quiz.current--; render(); };
  navRow.appendChild(backBtn);

  const rightGroup = document.createElement('div');
  rightGroup.style.cssText = 'display:flex; gap:10px;';

  const needsReveal = quiz.feedback && selected !== undefined && !revealed;
  if (idx < total - 1) {
    const nextBtn = document.createElement('button');
    nextBtn.className = 'btn';
    nextBtn.textContent = revealed ? 'Volgende vraag →' : 'Volgende →';
    nextBtn.onclick = () => {
      if (needsReveal) { quiz.revealed[q.id] = true; render(); return; }
      quiz.current++; render();
    };
    rightGroup.appendChild(nextBtn);
  } else {
    const submitBtn = document.createElement('button');
    submitBtn.className = 'btn';
    submitBtn.textContent = needsReveal ? 'Controleer mijn antwoord ✓' : (revealed ? 'Nu inleveren ✓' : 'Toets inleveren ✓');
    submitBtn.onclick = () => {
      if (needsReveal) { quiz.revealed[q.id] = true; render(); return; }
      finishQuiz();
    };
    rightGroup.appendChild(submitBtn);
  }
  navRow.appendChild(rightGroup);
  el.appendChild(navRow);

  const jumpHint = document.createElement('p');
  jumpHint.style.cssText = 'font-size:12.5px; color:var(--ink-soft); margin-top:14px;';
  const unanswered = total - answeredCount;
  const fbNote = quiz.feedback ? 'Na je antwoord klik je op Volgende: dan zie je meteen of het goed of fout is, met een korte toelichting. Een vraag zonder antwoord sla je over. ' : '';
  jumpHint.textContent = fbNote + (unanswered > 0 ? `${unanswered} vraag/vragen nog onbeantwoord. Je kunt altijd teruggaan voordat je inlevert.` : 'Alle vragen zijn beantwoord. Je kunt nog terug om iets aan te passen, of de toets inleveren.');
  el.appendChild(jumpHint);
}

function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

function finishQuiz() {
  const quiz = activeQuiz;
  const perQuestion = quiz.questions.map(q => {
    const chosen = quiz.answers[q.id];
    const correct = chosen === q.correct;
    return { qid: q.id, topic: q.topic, bloom: q.bloom, chapterId: q.chapterId, chapterTitle: q.chapterTitle, correct: !!chosen && correct, skipped: !chosen, chosen, correctAnswer: q.correct, question: q.q, options: q.shuffledOptions, explanation: q.explanation };
  });
  const correctCount = perQuestion.filter(p => p.correct).length;
  const skippedCount = perQuestion.filter(p => p.skipped).length;
  const incorrectCount = perQuestion.length - correctCount - skippedCount;

  const attempt = {
    date: new Date().toISOString(),
    type: quiz.mode,
    retry: !!quiz.retry,
    chapterId: quiz.chapterId || null,
    total: perQuestion.length,
    correctCount, incorrectCount, skippedCount,
    perQuestion
  };
  saveAttempt(attempt);
  quiz.lastAttempt = attempt;
  quiz.submitted = true;
  go({view:'results'});
}

/* ---------- Results ---------- */
function renderResults(el) {
  const quiz = activeQuiz;
  if (!quiz || !quiz.lastAttempt) { go({view:'dashboard'}); return; }
  const a = quiz.lastAttempt;
  const pct = Math.round(100 * a.correctCount / a.total);

  el.innerHTML = `
    <div class="page-eyebrow">${a.type === 'tentamen' ? '🎓 Tentamenresultaat' : '✏️ Oefentoetsresultaat'}${a.retry ? ' · alleen foute vragen' : ''}</div>
    <h2 class="page-title">Zo ging het!</h2>
    <div class="card score-hero">
      <div class="score-num">${pct}%</div>
      <div class="score-stats">
        <div class="score-stat"><div class="n">${a.correctCount}</div><div class="l">goed</div></div>
        <div class="score-stat"><div class="n">${a.incorrectCount}</div><div class="l">fout</div></div>
        <div class="score-stat"><div class="n">${a.skippedCount}</div><div class="l">overgeslagen</div></div>
        <div class="score-stat"><div class="n">${a.total}</div><div class="l">totaal</div></div>
      </div>
    </div>

    <div class="card" id="chapterBreakdown"><h3>📊 Analyse per hoofdstuk</h3><div id="chBars"></div></div>
    <div class="card" id="topicBreakdown"><h3>🔎 Analyse per onderwerp/model</h3><div id="topicBars"></div><div id="topicFeedback" style="margin-top:12px;"></div></div>
    <div class="card" id="reviewCard"><h3>📖 Nabespreking van foute antwoorden</h3><div id="reviewList"></div></div>

    <div style="display:flex; gap:12px; flex-wrap:wrap;">
      ${(a.incorrectCount + a.skippedCount) > 0 ? `<button class="btn" id="retryWrongBtn">🔁 Alleen foute vragen opnieuw (${a.incorrectCount + a.skippedCount})</button>` : ''}
      <button class="btn ${(a.incorrectCount + a.skippedCount) > 0 ? 'secondary' : ''}" id="retryBtn">Hele toets opnieuw</button>
      <button class="btn secondary" id="toProgress">Bekijk mijn voortgang 🌷</button>
      <button class="btn ghost" id="toDash">Terug naar dashboard</button>
    </div>
  `;

  // per-chapter breakdown
  const byChapter = {};
  a.perQuestion.forEach(pq => {
    const key = pq.chapterTitle || 'Onbekend';
    if (!byChapter[key]) byChapter[key] = {correct:0, total:0};
    byChapter[key].total++;
    if (pq.correct) byChapter[key].correct++;
  });
  const chBars = el.querySelector('#chBars');
  Object.entries(byChapter).forEach(([name, s]) => {
    chBars.appendChild(topicBarRow(name, s.correct, s.total));
  });

  // per-topic breakdown
  const byTopic = {};
  a.perQuestion.forEach(pq => {
    if (!byTopic[pq.topic]) byTopic[pq.topic] = {correct:0, total:0};
    byTopic[pq.topic].total++;
    if (pq.correct) byTopic[pq.topic].correct++;
  });
  const topicBars = el.querySelector('#topicBars');
  const sortedTopics = Object.entries(byTopic).sort((x,y) => (x[1].correct/x[1].total) - (y[1].correct/y[1].total));
  sortedTopics.forEach(([name, s]) => topicBars.appendChild(topicBarRow(name, s.correct, s.total)));

  const feedbackEl = el.querySelector('#topicFeedback');
  const weakTopics = sortedTopics.filter(([,s]) => s.correct/s.total < 0.6);
  if (weakTopics.length) {
    feedbackEl.innerHTML = weakTopics.map(([name,s]) => {
      const ch = a.perQuestion.find(pq => pq.topic === name).chapterTitle;
      return `<p style="font-size:13.5px; background:var(--bad-bg); border-radius:10px; padding:10px 14px; margin-bottom:8px;">Je maakt relatief veel fouten bij <strong>${name}</strong> (${ch}). Bekijk de samenvatting en infographic van dit onderdeel nog eens rustig door.</p>`;
    }).join('');
  } else {
    feedbackEl.innerHTML = `<p style="font-size:13.5px; background:var(--good-bg); border-radius:10px; padding:10px 14px;">Sterk werk — geen onderwerpen met opvallend veel fouten deze keer! 🌸</p>`;
  }

  // review wrong answers
  const reviewList = el.querySelector('#reviewList');
  const wrong = a.perQuestion.filter(pq => !pq.correct);
  if (!wrong.length) {
    reviewList.innerHTML = `<div class="empty-state"><div class="em">🎉</div>Geen foute antwoorden om te bespreken!</div>`;
  } else {
    wrong.forEach(pq => {
      const chosenText = pq.chosen ? (pq.options.find(o=>o.id===pq.chosen)||{}).text : null;
      const correctText = (pq.options.find(o=>o.id===pq.correctAnswer)||{}).text;
      const item = document.createElement('div');
      item.className = 'review-item';
      item.innerHTML = `
        <div class="review-q">${pq.question}</div>
        <div class="review-line incorrect">${pq.skipped ? 'Overgeslagen' : 'Jouw antwoord: ' + chosenText}</div>
        <div class="review-line correct">Juiste antwoord: ${correctText}</div>
        <div class="explain-box">${pq.explanation} <br><span style="color:var(--ink-soft); font-size:12px;">— ${pq.chapterTitle} · ${pq.topic}</span></div>
      `;
      reviewList.appendChild(item);
    });
  }

  el.querySelector('#retryBtn').onclick = () => {
    if (a.type === 'tentamen') go({view:'tentamen-setup'});
    else go({view:'oefentoets-setup', chapterId: a.chapterId});
  };
  const rwBtn = el.querySelector('#retryWrongBtn');
  if (rwBtn) rwBtn.onclick = () => {
    const wrongIds = new Set(a.perQuestion.filter(pq => !pq.correct).map(pq => pq.qid));
    startQuiz({mode: a.type, chapterId: a.chapterId, questions: quiz.questions.filter(q => wrongIds.has(q.id)), feedback: quiz.feedback, retry: true});
  };
  el.querySelector('#toProgress').onclick = () => go({view:'voortgang'});
  el.querySelector('#toDash').onclick = () => go({view:'dashboard'});
}

function topicBarRow(name, correct, total) {
  const pct = Math.round(100 * correct / total);
  const color = pct >= 80 ? 'var(--good)' : pct >= 50 ? 'var(--mid)' : 'var(--bad)';
  const row = document.createElement('div');
  row.className = 'topic-bar-row';
  row.innerHTML = `<div class="tname">${name}</div><div class="tbar"><div style="width:${pct}%; background:${color};"></div></div><div class="tpct">${pct}%</div>`;
  return row;
}

/* ---------- Voortgang ---------- */
function renderVoortgang(el) {
  const attempts = loadAttempts();
  el.innerHTML = `
    <div class="page-eyebrow">🌷 Mijn voortgang</div>
    <h2 class="page-title">Waar sta ik nu?</h2>
    <p class="page-sub">Gebaseerd op al jouw eerdere oefentoetsen en tentamens in deze app.</p>
  `;
  if (!attempts.length) {
    el.innerHTML += `<div class="card empty-state"><div class="em">🌱</div>Je hebt nog geen toetsen gemaakt. Maak een oefentoets om hier je voortgang te zien!</div>`;
    return;
  }

  const stats = topicStats();
  const entries = Object.entries(stats).map(([topic, s]) => ({topic, pct: Math.round(100*s.correct/s.total), total:s.total}));
  const sterk = entries.filter(e => e.pct >= 80).sort((a,b)=>b.pct-a.pct);
  const oefenen = entries.filter(e => e.pct >= 50 && e.pct < 80).sort((a,b)=>a.pct-b.pct);
  const prioriteit = entries.filter(e => e.pct < 50).sort((a,b)=>a.pct-b.pct);

  const mainAttempts = attempts.filter(a => !a.retry);
  const totalAttempts = mainAttempts.length;
  const avgPct = mainAttempts.length ? Math.round(100 * mainAttempts.reduce((s,a)=>s+a.correctCount,0) / mainAttempts.reduce((s,a)=>s+a.total,0)) : 0;

  el.innerHTML += `
    <div class="grid cols-3" style="margin-bottom:22px;">
      <div class="card" style="text-align:center;"><div class="score-num" style="font-size:32px;">${totalAttempts}</div><div style="font-size:13px; color:var(--ink-soft);">toetsen gemaakt</div></div>
      <div class="card" style="text-align:center;"><div class="score-num" style="font-size:32px;">${avgPct}%</div><div style="font-size:13px; color:var(--ink-soft);">gemiddelde score</div></div>
      <div class="card" style="text-align:center;"><div class="score-num" style="font-size:32px;">${prioriteit.length}</div><div style="font-size:13px; color:var(--ink-soft);">prioriteitsonderwerpen</div></div>
    </div>

    <div class="grid cols-3">
      <div class="card">
        <h3><span class="badge good">Sterk</span></h3>
        ${sterk.length ? sterk.map(e => `<p style="font-size:13.5px; margin:6px 0;">🌸 ${e.topic} <span style="color:var(--ink-soft);">(${e.pct}%)</span></p>`).join('') : '<p style="font-size:13px; color:var(--ink-soft);">Nog geen onderwerpen op dit niveau.</p>'}
      </div>
      <div class="card">
        <h3><span class="badge mid">Nog oefenen</span></h3>
        ${oefenen.length ? oefenen.map(e => `<p style="font-size:13.5px; margin:6px 0;">🌿 ${e.topic} <span style="color:var(--ink-soft);">(${e.pct}%)</span></p>`).join('') : '<p style="font-size:13px; color:var(--ink-soft);">Niets hier — goed bezig!</p>'}
      </div>
      <div class="card">
        <h3><span class="badge bad">Prioriteit</span></h3>
        ${prioriteit.length ? prioriteit.map(e => `<p style="font-size:13.5px; margin:6px 0;">🌷 ${e.topic} <span style="color:var(--ink-soft);">(${e.pct}%)</span></p>`).join('') : '<p style="font-size:13px; color:var(--ink-soft);">Geen prioriteiten — knap gedaan!</p>'}
      </div>
    </div>

    <div class="card" style="margin-top:22px;">
      <h3>📈 Geschiedenis van je toetsen</h3>
      ${attempts.slice().reverse().map(a => {
        const pct = Math.round(100*a.correctCount/a.total);
        const d = new Date(a.date);
        const label = (a.type === 'tentamen' ? 'Tentamen (alle hoofdstukken)' : ('Oefentoets — ' + (chapterById(a.chapterId)?.title || ''))) + (a.retry ? ' (alleen foute vragen)' : '');
        return `<div class="topic-bar-row"><div class="tname">${label}<br><span style="font-size:11px; color:var(--ink-soft);">${d.toLocaleDateString('nl-NL')} ${d.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})}</span></div><div class="tbar"><div style="width:${pct}%; background:${pct>=80?'var(--good)':pct>=50?'var(--mid)':'var(--bad)'};"></div></div><div class="tpct">${pct}%</div></div>`;
      }).join('')}
    </div>
  `;
}

/* ============================================================
   INIT
   ============================================================ */
render();
</script>
</body>
</html>
