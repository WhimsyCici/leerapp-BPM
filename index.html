<!DOCTYPE html>
<html lang="nl">
<head>

<title>Mijn BPM-leeromgeving</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {

    --blush-soft: #FCE6EF;

  }
  :root:not([data-theme="light"]) {

      --cream: #241A20;
      --page-bg: #1E1519;
      --blush: #35232B;
      --blush-soft: #2C1F26;
      --pink: #E39CAE;
      --pink-dark: #EDB4C2;
      --mauve: #F3D9E2;
      --ink: #EFE1E7;
      --ink-soft: #C6A9B4;
      --lilac: #33283F;
      --lilac-soft: #2A2131;
      --gold: #D9B876;
      --card-bg: #2C1F26;
      --border-soft: #43303A;
      --good: #9BB98C;
      --good-bg: #26301F;
      --mid: #D9B876;
      --mid-bg: #332A1A;
      --bad: #E19A9A;
      --bad-bg: #362124;
      --shadow: 0 8px 24px rgba(0,0,0,0.35);
      --shadow-sm: 0 3px 10px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"] {
    --cream: #241A20;
    --page-bg: #1E1519;
    --blush: #35232B;
    --blush-soft: #2C1F26;
    --pink: #E39CAE;
    --pink-dark: #EDB4C2;
    --mauve: #F3D9E2;
    --ink: #EFE1E7;
    --ink-soft: #C6A9B4;
    --lilac: #33283F;
    --lilac-soft: #2A2131;
    --gold: #D9B876;
    --card-bg: #2C1F26;
    --border-soft: #43303A;
    --good: #9BB98C;
    --good-bg: #26301F;
    --mid: #D9B876;
    --mid-bg: #332A1A;
    --bad: #E19A9A;
    --bad-bg: #362124;
    --shadow: 0 8px 24px rgba(0,0,0,0.35);
    --shadow-sm: 0 3px 10px rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--page-bg);
    color: var(--ink);
    font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

  }
  h1, h2, h3, h4 { font-family: 'Lora', Georgia, serif; color: var(--mauve); margin: 0 0 .5em 0; line-height: 1.25; }

  /* ---------- Layout ---------- */
  .app { display: flex; min-height: 100vh; }

  .sidebar {

  .brand-text h1 { font-size: 18px; margin: 0; }

  .nav-item {

    text-decoration: none;
    font-weight: 700;
    font-size: 14.5px;

  .nav-item:hover { background: rgba(255,255,255,0.5); }
  .nav-item.active { background: var(--card-bg); box-shadow: var(--shadow-sm); color: var(--pink-dark); }
  .nav-chapter-group { margin-top: 6px; }
  .nav-chapter-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 11px 14px; border-radius: var(--radius-sm); font-weight: 800; font-size: 14.5px;
    background: rgba(255,255,255,0.35); border: none; width: 100%; color: var(--mauve);
  }
  .nav-chapter-head .chev { transition: transform .2s ease; font-size: 11px; color: var(--ink-soft); }
  .nav-chapter-head.open .chev { transform: rotate(90deg); }
  .nav-sub { display: none; flex-direction: column; padding-left: 10px; margin-top: 2px; gap: 2px; }
  .nav-sub.open { display: flex; }
  .nav-sub .nav-item { font-weight: 600; font-size: 13.5px; padding: 9px 14px; }
  .add-chapter-hint {
    margin-top: 18px; padding: 12px 14px; border-radius: var(--radius-sm);

  }

    display: none;

    background: var(--card-bg); border: 1px solid var(--border-soft); border-radius: 999px;
    width: 42px; height: 42px; box-shadow: var(--shadow-sm); font-size: 18px;
  }

  main.content {
    flex: 1;

  .vk-support { display:grid; grid-template-columns: repeat(4,1fr); background: var(--lilac-soft); }

  .vk-support div:last-child{border-right:none;}
  .vk-primary { display:grid; grid-template-columns: repeat(5,1fr); background: var(--blush); }
  .vk-primary div { padding: 16px 6px; text-align:center; font-size:12px; font-weight:800; color: var(--pink-dark); border-right:1px solid var(--border-soft); }
  .vk-primary div:last-child{border-right:none;}
  .vk-tv { text-align:center; font-size:11px; padding:5px; background: var(--gold); color:#fff; font-weight:800; letter-spacing:.03em;}

  .niveau-card { border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; border:1px solid var(--border-soft); }
  .niveau-card.strat { background: var(--blush-soft); }
  .niveau-card.tact { background: var(--lilac-soft); }
  .niveau-card.oper { background: var(--good-bg); }
  .niveau-card h5 { margin:0 0 4px 0; font-family:'Lora',serif; color: var(--mauve); font-size:14.5px; }
  .niveau-card p { margin:0; font-size:13.5px; color: var(--ink); }

  .kenmerk-grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap: 14px; margin: 14px 0; }
  .kenmerk-card { background: var(--card-bg); border:1px solid var(--border-soft); border-radius:16px; padding:16px; box-shadow:var(--shadow-sm); }
  .kenmerk-card .kn { font-family:'Lora',serif; font-weight:700; color:var(--pink); font-size:22px; }

  .question-card { background: var(--card-bg); border:1px solid var(--border-soft); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px 30px; }

  .option {

  .option:hover { border-color: var(--pink); }

  .option .optletter {

  .quiz-nav-row { display:flex; justify-content:space-between; margin-top: 22px; gap: 10px; flex-wrap:wrap; }

  .explain-box { margin-top: 16px; padding: 14px 16px; border-radius: 14px; background: var(--lilac-soft); font-size: 13.5px; }

  /* results */
  .score-hero { text-align:center; padding: 28px 20px; }

  .setup-choice { display:flex; gap:12px; flex-wrap:wrap; margin: 16px 0 6px 0; }
  .chapter-check {

<script>
/* ============================================================
   DATA — uitsluitend gebaseerd op het aangeleverde bronmateriaal
   ============================================================ */
const CHAPTERS = [
  {
    id: 'h1',
    number: 1,
    title: 'Waar hebben we het over?',
    subtitle: "Een visie op procesgericht organiseren",
    summaryHtml: `
      <p><em>"Een proces is nooit toeval."</em> — variant op "Quality is never an accident", een uitspraak die wordt toegeschreven aan William A. Foster.</p>
      <p>Specifieke aandacht voor processen is in veel organisaties niet vanzelfsprekend. Het woord "proces" wordt vaak gebruikt, maar mensen verstaan er verschillende dingen onder. Processen worden vaak niet als strategisch of spannend gezien — soms zelfs geassocieerd met bureaucratie en "boekjes in de kast". Dit hoofdstuk licht de kernbegrippen van het BPM-vakgebied toe: wat is een proces, wat is procesmanagement, waarom zijn ze belangrijk, en hoe ziet de ideale procesgerichte organisatie eruit?</p>

      <h4>1.1 Wat bedoelen we met "processen"?</h4>
      <p>Losse definities van "proces" zijn te breed om bruikbaar te zijn. "Transformatie van inputs in outputs" maakt ook spijsvertering tot een proces; "activiteiten die in samenhang plaatsvinden" maakt zelfs roddelen, rouwen of ruziemaken tot een proces. Voor de context van organisaties voegt het boek daarom een paar elementen toe. Een <strong>proces</strong> is:</p>
      <ul>
        <li>een verzameling activiteiten die in samenhang plaatsvinden;</li>
        <li>gericht op een <strong>beoogd resultaat</strong>;</li>
        <li>dat <strong>toegevoegde waarde</strong> heeft voor een in- of externe klant;</li>
        <li>onderdeel van een <strong>samenhangend geheel</strong> van processen;</li>
        <li>tot op zekere hoogte <strong>herhaalbaar</strong>.</li>
      </ul>
      <p><strong>Toegevoegde waarde</strong> is wat een klant méér bereid is te betalen voor een product of dienst dan de kosten die de organisatie maakt om de grondstoffen in te kopen en het product of de dienst tot stand te brengen. Toegevoegde waarde bestaat alleen als de buitenwereld bereid is de activiteiten te belonen — door ervoor te betalen, of (bij non-profitorganisaties zoals vakbonden en scholen) door de organisatie een blijvend bestaansrecht toe te kennen. Zonder voldoende toegevoegde waarde loopt een organisatie het risico dat klanten een goedkopere leverancier vinden. Het oordeel of iets waarde toevoegt kan bovendien per klant verschillen.</p>
      <p>De term <strong>beoogd</strong> in "beoogd resultaat" benadrukt doelgerichtheid. In het boek illustreert het voorbeeld van een dagbladuitgeverij dit: kranten werden 's ochtends vóór openingstijd bij winkels neergelegd, waardoor klanten zich ongemerkt zonder te betalen bedienden. Zij ervoeren wel toegevoegde waarde, maar die was niet beoogd bij de inrichting van het proces.</p>
      <p>De meeste organisaties hebben niet één waardetoevoegende activiteit, maar een hele reeks activiteiten die samen een <strong>waardeketen</strong> (value chain) vormen — een begrip geïntroduceerd door Harvard-hoogleraar Michael Porter. Binnen een waardeketen wordt onderscheid gemaakt tussen <strong>primaire activiteiten</strong> (die de "echte" keten vormen: inkoop, productie, distributie, marketing &amp; verkoop, service) en <strong>ondersteunende activiteiten</strong> die daar als een laag overheen liggen (infrastructuur van de organisatie, personeelsbeheer, technologieontwikkeling, aankoop). Het model is toepasbaar op elk type organisatie, zelfs op het niveau van bedrijfssectoren.</p>
      <p><strong>Herhaalbaarheid</strong> betekent niet dat activiteiten telkens exact hetzelfde verlopen, maar wel dat het beoogde resultaat qua inhoud, moment en vorm in bepaalde mate voorspelbaar is. Herhaalbaarheid maakt het mogelijk verwachtingen van de klant te managen en is ook nodig om zinvol energie te steken in het inrichten of verbeteren van een proces. Herhaalbaarheid is ook het verschil tussen een <strong>proces</strong> en een <strong>project</strong> (dat gedefinieerd wordt als "een unieke opgave") — al is dit onderscheid in de praktijk soms arbitrair. Het boek illustreert dit met een voorbeeld uit de bouw: een serrebouwer (Serbo) plande de bouw zo gedetailleerd — met ingebouwde speelruimte (slack) — dat een schijnbaar uniek bouwproject tot op de dag nauwkeurig voorspelbaar werd; een teken van goed toegepast procesmanagement.</p>

      <h4>1.2 Wat bedoelen we met "procesmanagement"?</h4>
      <p>Processen zijn een manier om werk binnen een organisatie te organiseren. <strong>Procesmanagement</strong> is een manier om de doelen van een samenwerkingsverband te bepalen (<strong>richten</strong>), te bepalen hoe de organisatie er het beste voor kan worden ingericht om die doelen te halen (<strong>inrichten</strong>), en de feitelijke activiteiten uit te voeren om die doelen te realiseren (<strong>verrichten</strong>). Dit sluit aan bij hoe analistenbureau Gartner BPM tegenwoordig positioneert: niet als methodiek of tooling, maar als managementbenadering.</p>
      <p>Definitie: procesmanagement (of "Business Process Management", als synoniem beschouwd) is een managementbenadering waarin processen leidend zijn voor het richten van de organisatie op doelstellingen, het optimaal inrichten van de organisatie en het sturing geven aan de uitvoering, teneinde de doelstellingen te realiseren.</p>
      <p>Net als bij het gangbare onderscheid tussen strategisch, tactisch en operationeel management, vindt ook procesmanagement op deze drie niveaus plaats:</p>
      <ul>
        <li><strong>Strategisch niveau:</strong> positioneren van de organisatie in haar omgeving — wie zijn de klanten en strategische partners, welke waarde wil de organisatie creëren, hoe ziet de waardeketen eruit, wat zijn de primaire bedrijfsprocessen, en op welke kritische succesfactoren wordt gestuurd?</li>
        <li><strong>Tactisch niveau:</strong> het optimaal (her)ontwerpen en inrichten van processen, en het verkrijgen van inzicht in en optimaliseren van hun prestaties.</li>
        <li><strong>Operationeel niveau:</strong> input wordt via een doelgericht en voorspelbaar proces omgezet in vooraf gedefinieerde resultaten voor klanten of ketenpartners, waarbij processen voortdurend op indicatoren worden gemeten en bijgestuurd.</li>
      </ul>
      <p>Beïnvloeding loopt niet alleen van boven naar beneden: tactische besturing is gebaseerd op informatie over feitelijke prestaties, en strategische besluitvorming wordt weer gevoed met managementinformatie vanuit het tactische niveau.</p>

      <h4>1.3 Denken en doen in processen: waarom is dat zo belangrijk?</h4>
      <p>Het boek noemt vier redenen:</p>
      <ol>
        <li><strong>Klantoriëntatie:</strong> om van een proces te kunnen spreken, moet duidelijk zijn wie de klant is en welke eisen die klant stelt. Omdat een organisatie alleen bestaansrecht heeft als de buitenwereld waarde toekent aan wat zij doet, houdt sturing op klantgerichte processen de externe doelen centraal — ook als afzonderlijke afdelingsdoelen dat dreigen te overschaduwen. Het voorbeeld van een pensioenverzekeraar illustreert dit: ontevredenheid door jargon en "van het kastje naar de muur" werd aangepakt door processen opnieuw te ontwerpen vanuit de vraag wie de klant is en wat hij nodig heeft (één loket, klantenteams, klanten laten meedenken over begrijpelijke brieven).</li>
        <li><strong>Efficiency:</strong> inzicht in processen laat zien welke activiteiten geen waarde toevoegen (en dus kunnen vervallen of geautomatiseerd worden), welke stappen dubbel gebeuren of in een onlogische volgorde staan, en waar overdrachtspunten onnodig vertraging en fouten veroorzaken.</li>
        <li><strong>Wendbaarheid:</strong> waar beheersing en efficiency vroeger de belangrijkste motieven waren, is wendbaarheid tegenwoordig in veel branches het belangrijkste concurrentievoordeel. Grip op processen is een randvoorwaarde om snel te kunnen veranderen — je moet immers weten wát je moet veranderen.</li>
        <li><strong>Bewustzijn bij medewerkers:</strong> door samen met medewerkers de klant-leverancierrelaties in de waardeketen te analyseren, gaan zij collega's en andere afdelingen als "interne klant" zien. Dit vergroot de focus op het (tussen)resultaat en vermindert fouten, wachttijden en dubbel werk bij overdrachtsmomenten.</li>
      </ol>
      <p>Om deze doelen te bereiken is geen "kille", uitsluitend op beheersing en controle gerichte vorm van procesmanagement nodig, maar een benadering die over afdelingen en disciplines (zoals kwaliteitszorg, informatiemanagement, organisatiekunde en HRM) heen een gedeeld bewustzijn van klantbehoeften, werkwijzen en begrippen ontwikkelt. Iedere medewerker moet begrijpen hoe zijn werk bijdraagt aan het klantresultaat, zodat hij verantwoordelijkheid kan nemen en vanzelfsprekend blijft zoeken naar verbetering. Dit noemt het boek <strong>procesgericht organiseren</strong>.</p>

      <h4>1.4 Hoe ziet een "procesgerichte organisatie" eruit?</h4>
      <p>Er is geen one-size-fits-all-beschrijving, maar de volgende zeven kenmerken zijn in meer of mindere mate aanwezig:</p>
      <ol>
        <li><strong>Klantfocus leidend voor de organisatie van het werk</strong> — denken in waardeketens en klant-leverancierrelaties staat centraal; functionele silo's zijn afgebroken en de organisatie is meer horizontaal.</li>
        <li><strong>Beheersing en wendbaarheid door een samenhangende bedrijfsinrichting</strong> — missie, strategie, besturingsvisie, organisatie-inrichting, cultuur en IT vormen een congruent, op processen gebaseerd geheel.</li>
        <li><strong>Focus van de besturing op klantresultaten</strong> — resultaatsturing en empowerment; performance van processen als geheel en de door de klant ervaren performance wegen zwaarder dan uitsluitend financiële indicatoren.</li>
        <li><strong>Ruimte voor creatieve en ondernemende professionals</strong> — goed ingerichte processen stellen mensen juist in staat te doen waar ze goed in zijn, met name in kennisintensieve, creatieve, complexe of gemengde processen.</li>
        <li><strong>Van dirigeren en controleren naar faciliteren en coachen</strong> — vertrouwen, empowerment en teamwerk zijn essentieel; klantwaardering is een belangrijkere indicator dan kostenindicatoren.</li>
        <li><strong>Voortdurende verbetering en innovatie</strong> — medewerkers, teams en de organisatie als geheel zijn gericht op voortdurend meten, leren en verbeteren; systeemdenken en een gedeelde visie zijn belangrijke waarden.</li>
        <li><strong>Veranderen: van buiten naar binnen</strong> — verandering die vanuit de klant vertrekt en samen met medewerkers vorm krijgt, heeft een grotere slagingskans dan top-down gedreven verandering.</li>
      </ol>

      <h4>1.5 Conclusie</h4>
      <p>Voor de definitie van een proces zijn "toegevoegde waarde", "beoogd resultaat", "samenhangend geheel" en "herhaalbaarheid" de kernelementen. Doordat toegevoegde waarde en beoogd resultaat in de definitie zitten, is een proces per definitie gericht op belanghebbenden búiten het proces zelf — vaak de klant. De elementen samenhangend geheel en herhaalbaarheid maken beheersing (en dus procesmanagement) van belang.</p>
      <p>Procesmanagement gaat over hoe processen als uitgangspunt worden genomen bij het sturen van de organisatie op strategisch, tactisch én operationeel niveau. Het boek onderbouwt dat organisaties alleen via een benadering vanuit processen in staat zijn om:</p>
      <ul>
        <li>klantgerichtheid en efficiency te combineren;</li>
        <li>beheersing (compliance) te combineren met flexibiliteit en continue verbetering;</li>
        <li>resultaatgerichtheid te combineren met ruimte voor professionals.</li>
      </ul>
      <p>De ideale procesgerichte organisatie is sterk klantgericht en horizontaal georganiseerd, met vertrouwen en empowerment als kernwaarden, resultaatsturing gericht op klantperformance, en een sterk lerend vermogen. De overgang hiernaartoe verloopt stap voor stap, via verschillende stadia van "procesvolwassenheid" — het onderwerp van hoofdstuk 2.</p>

    title: 'Procesgericht worden is ook een proces',

      <p><em>"Competition is going to be defined by those companies that have best-in-class processes."</em> — Michael James Melenovsky, Research Director Gartner.</p>
      <p>Sommige jonge ondernemingen maken vanaf het begin een stormachtige groei door — zoals Healthy People, een bedrijf dat dagelijks tienduizenden vruchtensapjes afzet, de hele keten op basis van KPI's bestuurt en met een team van zeven mensen uitgroeide tot een marktbepalende speler die de concurrentie aangaat met grote multinationals. De oprichters verklaren dit succes vanuit consequent klantgericht en procesgericht denken en doen. Veel organisaties zouden graag net zo klantgericht, flexibel en efficiënt zijn — maar vanuit een bestaande situatie is het niet eenvoudig om echt greep op processen te krijgen en klantwensen centraal te stellen.</p>
      <p>Het effectief toepassen van procesmanagement als managementfilosofie voor de hele organisatie kan niet van de ene op de andere dag. Een goed startpunt is vaststellen waar de organisatie nu eigenlijk staat: op welk volwassenheidsniveau van procesmanagement bevindt ze zich? Om die discussie te voeren is een <strong>maturity model</strong> een onmisbaar instrument — het geeft zicht op waar je staat, waar je zou willen staan, en wat haalbare en logische tussenstappen zijn.</p>

      <h4>2.1 Is groei naar meer procesgerichtheid altijd nodig?</h4>
      <p>Procesgerichtheid is geen doel op zich. De noodzaak om te groeien in procesvolwassenheid komt altijd voort uit eisen die de omgeving stelt: hoe sterker de concurrentie, hoe dynamischer de omgeving, en hoe hoger de eisen aan transparantie, des te hoger het procesvolwassenheidsniveau dat nodig is om als organisatie te overleven. Waar vroeger vooral sectoren als de automotive- en farmaceutische industrie de druk van een mondiale markt voelden, hebben tegenwoordig ook energiebedrijven, pensioenuitvoerders, zorgverleners en zelfs van oudsher weinig veranderingsgezinde overheidsorganisaties hiermee te maken. Groeien naar een hoger niveau van procesvolwassenheid is dus een middel om onder externe invloeden zoals concurrentie en maatschappelijke druk het bestaansrecht van de organisatie duurzaam veilig te stellen.</p>

      <h4>2.2 Een BPM maturity model: wat en waarom</h4>
      <p>Een BPM maturity model karakteriseert de verschillende stadia waarin een organisatie zich kan bevinden op weg naar volledige procesgerichtheid. Het gebruik van zo'n model kent drie toepassingen:</p>
      <ol>
        <li>Met een (quick)scan inzicht bieden in het volwassenheidsniveau van een organisatie — niet zozeer om objectief te scoren, maar om een gezamenlijk bewustzijn en een gedeelde overtuiging te ontwikkelen over de te nemen stappen.</li>
        <li>Een gedachtewisseling op gang brengen (met name tussen management en BPM'ers) over de voortgang van lopende BPM-initiatieven, met een gezamenlijk begrippenkader.</li>
        <li>Als basis voor het identificeren van verbetermogelijkheden — de "gap" tussen het huidige en het gewenste niveau — en het bepalen van het ambitieniveau.</li>
      </ol>

      <h4>2.3 Waarom een eigen Procesgericht Organiseren Maturity Model?</h4>
      <p>Veel bestaande maturity modellen zijn afgeleid van het <strong>Capability Maturity Model (CMM)</strong>, oorspronkelijk bedoeld voor software-ontwikkelprocessen (niveaus: non-existent, initial, repeatable, defined, managed, optimized) — een indeling die niet goed toepasbaar is op een hele organisatie. Andere modellen, zoals het Business Process Maturity Model (BPMM), kijken wel naar de organisatie als geheel, maar richten zich vaak op een of enkele aspecten zoals informatievoorziening of besturing. Daarom is in dit boek gekozen voor een eigen model: het <strong>Procesgericht Organiseren Maturity Model (POM-model)</strong>. Onderscheidend hieraan is dat het kijkt naar de organisatie als geheel — hoe procesgerichtheid doorwerkt in besturing, organisatie-inrichting, ICT en cultuur — en handvatten biedt om bevindingen te vertalen naar concrete acties. Het gaat daarbij niet zozeer om instrumenten (KPI's, proceseigenaren, BPM-systemen) als wel om de <strong>attitude</strong>: staat procesgerichtheid ook echt hoog op de managementagenda, of gaat het in het managementteam nog vooral over financiële resultaten en structuurwijzigingen?</p>

      <h4>2.4 Waaruit bestaat het POM-model?</h4>
      <p>Het POM-model beschrijft <strong>zes volwassenheidsniveaus</strong> van procesmanagement en geeft aan hoe strategie, cultuur, organisatie-inrichting, de inzet van ICT en de belegging van verantwoordelijkheid er bij elk niveau uitzien. Bij de laagste niveaus zijn nog geen eenduidige uitspraken te doen over samenhang tussen deze aspecten, omdat er weinig samenhang bestaat. Groeien naar hogere niveaus betekent deze dimensies steeds meer in samenhang bekijken. Er ontstaat een verschuiving van sturen op taken naar sturen op resultaten van processen als geheel, met de focus steeds meer op het realiseren van toegevoegde waarde voor de klant. De zes niveaus (figuur 2.1) zijn: <strong>1 Gefragmenteerd</strong>, <strong>2 Structurerend</strong>, <strong>3 Borgend</strong>, <strong>4 Sturend</strong>, <strong>5 Lerend</strong> en <strong>6 Integrerend (keten)</strong>.</p>

      <h4>2.5 Volwassenheidsniveaus</h4>
      <p><strong>Niveau 0?</strong> Veel modellen kennen een niveau 0 ("nog niets aanwezig"). Het POM-model laat dit niveau weg, omdat een volwassenheidsmeting wordt uitgevoerd op basis van de vraag: hoe wordt binnen de organisatie tegen processen aangekeken?</p>
      <p><strong>Niveau 1: gefragmenteerd.</strong> Er zijn activiteiten rond processen als daar een externe aanleiding voor is (wet- of regelgeving, een accountantseis, een kwaliteitscertificaat, een nieuw IT-systeem). Beschrijvingen zijn toepassingsspecifiek, gericht op het "hoe", per afdeling opgesteld, zonder vaste afspraken over vorm of tools. Activiteiten zijn projectmatig; na afloop is het beheer van de beschrijvingen lastig te waarborgen. Strategie: processen krijgen geen bijzondere aandacht. Besturing: financieel en op de lijn gericht. Organisatie: traditioneel verticaal, procesmanagement niet herkenbaar als verantwoordelijkheidsgebied. Cultuur: sterke verbondenheid met de eigen afdeling. IT: per afdeling ("eilandautomatisering"), geen specifieke tools.</p>
      <p><strong>Niveau 2: structurerend.</strong> Er wordt gewerkt aan het inzichtelijk maken van processen; er komen afspraken over vastlegging en mogelijk een vastleggingstool. De eerste puzzelstukjes van een procesarchitectuur ontstaan, vaak vanuit een IT-invalshoek. Eén afdeling begint met coördinatie, maar er is nog geen zelfstandige BPM-functie; procesverbetering vindt plaats in (tijdelijke) programma's. Strategie: processen als aandachtsgebied genoemd, nog niet strategisch. Besturing: ook niet-financiële indicatoren (bijv. balanced scorecard-KPI's). Organisatie: mogelijk start met proceseigenaarschap, eindverantwoordelijkheid nog bij lijnmanagers. Cultuur: gericht op een gezamenlijk begrippenkader. IT: afdelingsoverschrijdende systemen, tools voor procesontwerp.</p>
      <p><strong>Niveau 3: borgend.</strong> De structuur van niveau 2 wordt gebruikt om actief te sturen op het effectief bedienen van de klant: producten, diensten, processen en IT worden doelbewust op elkaar afgestemd, met de klantbehoefte centraal. Er is een procesarchitectuur, opgesteld door proces- of businessarchitecten samen met lijnmanagers, als gezamenlijk referentiekader. Er komt een zelfstandige BPM-functie; risicomanagement en wet- en regelgeving raken steeds meer "ingebakken" in de processen. Strategie: klantbehoeften centraal, congruentie tussen inrichtingsaspecten. Besturing: klantindicatoren belangrijk, structurele verbetercycli. Organisatie: commitment vanuit de top, afdelingsoverstijgende coördinatie. Cultuur: klantgericht en samenwerkingsgericht. IT: nadrukkelijker ingezet voor sturing, vanuit architectuurgedachte.</p>
      <p><strong>Niveau 4: sturend.</strong> Horizontale sturing dwars door de organisatie is vanzelfsprekend; ook de verantwoordelijkheid voor het beheren en verbeteren van processen ligt in de lijn. De organisatiestructuur is niet langer functioneel maar procesgericht: proceseigenaarschap is het dominante ordeningscriterium en processturing is leidend boven functioneel management. De beloningssystematiek is afgeleid van procesprestaties; financiële kortetermijnresultaten worden minder sturend, klantbeleving en het bereiken van veranderdoelen belangrijker. Strategie: procesgericht werken is zo vanzelfsprekend dat het mogelijk niet eens expliciet genoemd wordt. Besturing: procesturing leidend. Organisatie: kanteling van functioneel naar procesgericht. Cultuur: continu verbeteren. IT: vraag- en aanbodkant van interne IT-dienstverlening organisatorisch gescheiden.</p>
      <p><strong>Niveau 5: lerend.</strong> Processen zijn niet meer iets van managers: procesgericht denken en doen is organisatiebreed een vanzelfsprekende houding. Medewerkers gebruiken inzicht in en communicatie over processen om zelf en in teams richting te geven aan hun werk. Hiërarchisch/functioneel management en procesmanagement vallen samen: de eindverantwoordelijkheid ligt eenduidig bij de proceseigenaar. Strategie: visie dat voortdurend leren als systeem cruciaal is. Besturing: real-time sturing op processen. Cultuur: focus op leerprocessen. IT: moderne hulpmiddelen zoals BPMS, performancemanagementtools en procesmining, snel aanpasbaar door de organisatie zelf.</p>
      <p><strong>Niveau 6: integrerend (keten).</strong> De grenzen van de eigen organisatie spelen geen echte rol meer bij procesontwerp en -verbetering: deskundigheid wordt gebruikt om elders in de keten te helpen verbeteren, en meting van procesprestaties loopt door de hele keten. Er is een strategische beweging naar buiten toe: processen worden ingericht in de context van de keten, met klanten én leveranciers betrokken. Er wordt kritisch overwogen welke processen de organisatie zelf wil blijven uitvoeren en welke beter uitbesteed (of juist ingesourcet) kunnen worden. Besturing: ketenmanagement leidend, met "collaborative KPI's". Organisatie: kleine kernorganisatie met hoogwaardige professionals. Cultuur: extern gericht en proactief. IT: shared services en integratie met externe systemen vanzelfsprekend.</p>

      <h4>2.6 Hoe hoger hoe beter?</h4>
      <p>Niet elke organisatie hoeft per se naar het hoogste niveau te streven — haar strategie kan ook zonder de kenmerken van het hoogste niveau gerealiseerd worden, en niet elke organisatie kan of wil vanuit haar aard naar een regisseursrol groeien. Anderzijds is het de vraag of een organisatie op termijn kan overleven als zij op niveau 2 of 3 blijft steken: onderpresteren leidt vroeg of laat tot klantverlies, of — bij publieke dienstverlening — tot ingrijpen van hogerhand.</p>

      <h4>2.7 Handvatten om stappen verder te komen</h4>
      <p>Er is geen one-size-fits-all-aanpak; op elk niveau is de uitdaging anders, en meer van hetzelfde (betere modelleertools) brengt niet de benodigde "step change". Per overgang noemt het boek typische acties:</p>
      <ul>
        <li><strong>Van 1 naar 2:</strong> een organisatie-eigen aanpak voor procesverbetering maken; procesmatig en klantgericht denken introduceren via workshops en trainingen; resultaten van verbetertrajecten onder de aandacht brengen; afdelingsoverstijgende verbetermogelijkheden signaleren.</li>
        <li><strong>Van 2 naar 3:</strong> een samenhangend procesmodel maken dat overzicht en kaders biedt; pilots zoeken met snel merkbare resultaten; workshops voor klantbewustzijn; de brug slaan tussen IT en "de business".</li>
        <li><strong>Van 3 naar 4:</strong> besturingsvragen nadrukkelijker op de managementagenda brengen; kennis over proceseigenaarschap en procesarchitecten vergroten; de vraag- en aanbodrol van IT scheiden — ter voorbereiding op de organisatorische "kanteling" die niveau 4 kenmerkt.</li>
        <li><strong>Van 4 naar 5:</strong> proceseigenaren en procesmanagers trainen in hun nieuwe rol; projectvoorstellen voor technologie zoals BPM-systemen en Business Activity Monitoring; de BPM-discipline ontwikkelen tot ogen, oren en handen van het topmanagement.</li>
        <li><strong>Van 5 naar 6:</strong> ketenpartners (klanten, leveranciers, coproducenten) betrekken bij projecten; mogelijkheden voor business process outsourcing scannen.</li>
        <li><strong>Op niveau 6:</strong> de uitdaging is om de behaalde resultaten en ontwikkelde kennis vast te houden en door te ontwikkelen, met ketenmanagement en ketenherinrichting als dominante thema's.</li>
      </ul>

      <h4>2.8 Conclusie</h4>
      <p>Succesvol procesmanagement is meer dan een optelsom van acties: het gaat om richten, inrichten en verrichten — een visie en strategie ontwikkelen, deze vertalen naar consequenties voor de inrichting, en daadwerkelijk ingesleten patronen en machtsstructuren veranderen. Het POM-model helpt een beeld te vormen van de huidige procesvolwassenheid en biedt grond om een veranderstrategie te ontwikkelen. De essentie blijft dat procesmanagement pas echt impact heeft als alle organisatieaspecten — processen, organisatie-inrichting, IT, visie en cultuur — een samenhangend geheel vormen. De noodzakelijke veranderprocessen, met name in het denken en de houding van management en medewerkers zelf, blijken daarbij het lastigste punt.</p>

  {
    id: 'h3',
    number: 3,
    title: 'Een proces, dat is toch iets met hokken en pijltjes?',
    subtitle: 'Het modelleren van processen',
    summaryHtml: `
      <p><em>"Het enige model dat in de werkelijkheid bestaat is een fotomodel... en zelfs dat is maar de vraag."</em></p>
      <p>In principe kan een proces voldoen aan de definitie uit hoofdstuk 1 zonder dat het expliciet beschreven of ontworpen is. Zodra een proces echter vraagt om de inzet van meer mensen of verschillende hulpmiddelen (machines of systemen) die niet op dezelfde tijd en plaats een bijdrage leveren, wordt een vorm van vastlegging vaak noodzakelijk: hoe hangen activiteiten met elkaar samen, en hoe wordt het proces beheerst zodat resultaten voldoende voorspelbaar zijn? Maar welke eisen moet je aan zo'n vastlegging stellen? Is "modelleren" hetzelfde als "ontwerpen"? Hoe gedetailleerd moet het, en welke methode is het meest bruikbaar?</p>

      <h4>3.1 Redenen om processen vast te leggen</h4>
      <p>Vaak is het vastleggen van processen geen keuze maar noodzaak — bijvoorbeeld voor een kwaliteitscertificaat, een accountantseis of een nieuw ICT-systeem. Het boek noemt acht redenen of aanleidingen om processen te beschrijven:</p>
      <ol>
        <li><strong>Kwaliteit</strong> — om de kwaliteit van een product of proces te kunnen beoordelen en op basis hiervan een kwaliteitscertificaat af te geven.</li>
        <li><strong>Compliance</strong> — voldoen aan regelgeving: procesbeschrijvingen laten zien waar regels ingrijpen in het werk en maken het eenvoudiger eraan te voldoen en dit te bewijzen (bijvoorbeeld bij veiligheidsprocedures of contractuele vereisten).</li>
        <li><strong>Procesgerichte compliance</strong> — voldoen aan regelgeving die specifiek vereist dat processen zijn vastgelegd, met als doel het aantoonbaar beheersen van processen (bijvoorbeeld regelgeving in de financiële sector).</li>
        <li><strong>Architectuur</strong> — inzicht hoe processen met elkaar samenhangen en samenhangen met andere aspecten, met name informatievoorziening.</li>
        <li><strong>Automatisering</strong> — bij het selecteren of aanschaffen van een nieuw ICT-systeem wordt aan de hand van procesbeschrijvingen bepaald aan welke eisen dit moet voldoen.</li>
        <li><strong>Organisatie</strong> — een procesbeschrijving maakt duidelijk wie wat doet, in welke volgorde en wie verantwoordelijk is voor welke stap.</li>
        <li><strong>Strategie-implementatie</strong> — procesbeschrijvingen helpen medewerkers begrijpen hoe hun werk bijdraagt aan het geheel.</li>
        <li><strong>Communicatie</strong> — duidelijke, begrijpelijke schema's helpen ideeën over een nieuwe situatie over te dragen en erover van gedachten te wisselen.</li>
      </ol>

      <h4>3.2 Per doel een beschrijving of juist niet?</h4>
      <p>Zonder afspraken over vastlegging kan het voorkomen dat voor elk doel aparte beschrijvingen worden gemaakt — met veel werk en verwarring tot gevolg. Veel mooier is het om procesbeschrijvingen te maken die tegelijkertijd meerdere doelen dienen. Zulke beschrijvingen moeten:</p>
      <ul>
        <li>zichtbaar maken hoe activiteiten in samenhang resultaten opleveren die aan de wensen van de klant voldoen;</li>
        <li>laten zien hoe regels worden toegepast en hoe aan regelgeving wordt voldaan;</li>
        <li>een basis bieden voor besturing van processen;</li>
        <li>inzichtelijk zijn voor de mensen die ermee moeten werken;</li>
        <li>makkelijk aanpasbaar zijn bij veranderingen in de omgeving of van technologie.</li>
      </ul>
      <p>Dit lukt alleen als begrippen, uitgangspunten en definities zorgvuldig worden gehanteerd, en bewust wordt omgegaan met de verschillende niveaus waarop processen vastgelegd kunnen worden.</p>

      <h4>3.3 IST en SOLL, modelleren en ontwerpen</h4>
      <p>Er blijft altijd een onderscheid tussen de processen zoals ze feitelijk plaatsvinden en een gewenst, ideaal procesverloop: het verschil tussen "IST" en "SOLL". Dat brengt ons bij het verschil tussen <strong>modelleren</strong> en <strong>ontwerpen</strong>. Met "modelleren" wordt het weergeven van de huidige of toekomstige werkelijkheid met behulp van een model of schema bedoeld — het gaat dan niet zozeer om vernieuwing of keuzes. Bij "procesontwerpen" is dit wel het geval: dat is het resultaat van nadenken over hoe een proces er het beste uit kan zien. Het onderscheid is niet altijd scherp: het modelleren van een proces geeft soms aanleiding tot nadenken over hoe het slimmer of beter zou kunnen. Procesmodellen zijn tekeningen van het proces met bijbehorende tekstuele toelichtingen — ze zijn onderdeel van procesbeschrijvingen.</p>

      <h4>3.4 Processen op verschillende niveaus</h4>
      <p>Het is belangrijk bewust onderscheid te maken tussen de niveaus waarop processen plaatsvinden: het invoeren van een adreswijziging is een proces, maar het produceren van een auto ook. Het boek onderscheidt vier niveaus van procesbeschrijvingen (figuur 3.1), elk met een eigen "view", gezichtspunt op de(zelfde) werkelijkheid — een lager niveau is dus meer dan alleen een detaillering van het hogere niveau:</p>
      <ul>
        <li><strong>Keten</strong> — het <strong>ketenmodel</strong> maakt zichtbaar hoe organisatieoverstijgend toegevoegde waarde wordt gecreëerd, en wat de eigen positie en toegevoegde waarde zijn in de keten(s).</li>
        <li><strong>Organisatie</strong> — het <strong>bedrijfsprocesmodel</strong> laat zien welke toegevoegde waarde de organisatie wil leveren aan externe afnemers, vertaald vanuit missie en strategie "van klant tot klant" (What business are we in?). Hierin wordt meestal onderscheid gemaakt tussen primaire, besturende en ondersteunende processen. Een <strong>bedrijfsproces</strong> bestaat op slechts één niveau.</li>
        <li><strong>Organisatieonderdeel</strong> — <strong>werkprocesbeschrijvingen</strong> geven een beeld van de activiteitenclusters waaruit bedrijfsprocessen zijn opgebouwd ("decomponeren"). Dit niveau is cruciaal: werkprocesbeschrijvingen helpen bij het maken van goede keuzes voor besturing, organisatie-inrichting en IT. In tegenstelling tot bedrijfsprocessen kunnen werkprocessen op meerdere subniveaus bestaan, tot op het niveau van processtappen.</li>
        <li><strong>Uitvoering</strong> — hier gaat het niet om het "wat" maar om het "hoe". <strong>Procesflows</strong> beschrijven hoe werkprocessen voor een bepaald type geval ("case") worden doorlopen — in welke volgorde welke processtappen. <strong>Procedures</strong> beschrijven de voorgeschreven opeenvolging van handelingen door functionarissen of systemen, gericht op het beperken van risico's op afwijkingen. Een <strong>handeling</strong> is de kleinst mogelijke eenheid van werk. Een <strong>werkinstructie</strong> maakt, vanuit één specifieke rol, de kennis en kunde expliciet die nodig is voor een taak.</li>
      </ul>

      <h4>3.5 Werken vanuit wat er al is</h4>
      <p>Weinig organisaties hebben procesbeschrijvingen die aan alle definities en eisen voldoen. Een goed startpunt is de bestaande beschrijvingen te typeren en ontbrekende niveaus aan te vullen, in plaats van helemaal opnieuw te beginnen. Beschrijvingen van een lager niveau kunnen worden "ingedikt" naar een hoger niveau, of andersom uitgewerkt: ketenniveau naar bedrijfsprocesniveau (uitgaand van de scope van de eigen organisatie); bedrijfsprocesniveau naar werkprocesniveau (het bedrijfsproces "opknippen" in toegevoegdewaardebrokken die een naam krijgen, vervolgens verder "uiteengerafeld" tot op het niveau van processtappen); en werkprocesniveau naar procesuitvoeringsniveau (afhankelijk van de aard van het werkproces en de eisen aan procesbeheersing). Belangrijk om te beseffen: op het niveau van werkprocessen lopen groepen gevallen door het proces, pas bij procesflows en procedures komen specifieke, individuele gevallen in beeld (figuur 3.2).</p>

      <h4>3.6 Basisregels voor het modelleren van processen</h4>
      <p>Elke modelleringsmethode kent eigen regels, maar een aantal basisregels komt altijd terug:</p>
      <ol>
        <li>Modelleer processen zo veel mogelijk van klant tot klant: start met een behoefte of vraag van de klant en eindig met een resultaat dat daaraan invulling geeft.</li>
        <li>Een proces begint dus vaak met afstemming met de klant en eindigt met overdracht naar de klant (impliciet of volledig geautomatiseerd).</li>
        <li>Ieder deelproces of iedere processtap heeft een betekenisvolle bijdrage of resultaat.</li>
        <li>Modelleer maximaal zeven processtappen in één schema; worden het er meer, verdiep of decomponeer dan.</li>
        <li>Zorg dat processtappen op één niveau zo veel mogelijk hetzelfde "gewicht" hebben.</li>
        <li>Er zijn geen processtappen zonder relatie met minstens één andere processtap.</li>
      </ol>
      <p>Voor naamgeving: gebruik werkwoord + zelfstandig naamwoord (bijv. "behandelen aanvraag"); kies namen zo dat onderliggende subprocessen "logisch optelbaar" zijn naar boven (bijv. "bereiden van deeg" en "bakken van brood" zijn logische subprocessen van "maken van brood" — "verkopen van brood" niet); gebruik voor in- en outputs een zelfstandig naamwoord; en namen mogen niet dubbel voorkomen in hetzelfde model.</p>

      <h4>3.7 Indeling procesmodelleringsmethoden</h4>
      <p>Het overweldigende aanbod aan methoden is terug te brengen tot vier basisbenaderingen:</p>
      <ol>
        <li><strong>De black-box- of systeembenadering</strong> — een proces als werkingsmechanisme waar iets definieerbaars in en uit gaat, waaraan van buitenaf sturing gegeven kan worden; processen kunnen steeds verder uiteengerafeld worden. Voorbeelden: <strong>IDEF</strong> en <strong>BPMN</strong>.</li>
        <li><strong>De transactiebenadering</strong> — een proces als transactie met de buitenwereld, waaromheen communicatie moet plaatsvinden. Voorbeeld: de <strong>DEMO</strong>-methode.</li>
        <li><strong>De petrinet-benadering</strong> — een proces als mechanisme om gevallen door een netwerk te routeren, gebaseerd op een wiskundige benadering.</li>
        <li><strong>De taakbenadering</strong> — een proces als opeenvolging van taken en beslissingen, uitgevoerd door mensen of systemen. Voorbeeld: de <strong>flowchart</strong>-methode (in Nederland ook wel "SDW-AO" genoemd).</li>
      </ol>
      <p>Methoden die zich op andere doelen richten, zoals het verbeteren van processen (Business Process Reengineering, Six Sigma), worden soms onterecht procesmodelleringsmethoden genoemd. Enkele in Nederland veelgebruikte methoden en technieken:</p>
      <ul>
        <li><strong>BPMN</strong> (Business Process Modeling Notation) — een grafische notatiewijze, gebaseerd op de petrinet-benadering, steeds meer een standaard; beheerd door The Object Management Group; vooral prettig ervaren door businessanalisten en softwareontwikkelaars.</li>
        <li><strong>IDEF0</strong> — een van de eerste standaarden, gebaseerd op de systeembenadering; kracht is de eenvoud, met maar één symbool (de "activity-box") voor een werkproces of processtap, met pijlen voor input, stuurmiddel, hulpmiddel en output (figuur 3.3).</li>
        <li><strong>DEMO</strong> — een Nederlandse methode (TU Delft, hoogleraar Dietz), oorspronkelijk "Dynamic Essential Modeling of Organisations", nu "Design & Engineering Methodology for Organizations"; communicatieacties staan centraal.</li>
        <li><strong>Flowchart</strong> — gericht op het vastleggen van administratieve procedures met een symbooltaal; in Nederland ook bekend als SDW-AO.</li>
        <li><strong>UML</strong> — eigenlijk geen methode maar een "modeltaal" voor het analyseren en ontwerpen van informatiesystemen (methode: RUP); use-casediagrammen zijn in de ogen van de auteurs geen echte procesmodellen.</li>
        <li><strong>Swimlanes</strong> — geen echte methode maar een techniek: activiteiten worden in horizontale banen geordend zodat zichtbaar is wie welke processtap uitvoert.</li>
      </ul>

      <h4>3.8 Keuze voor een modelleringsmethode</h4>
      <p>De beste methode hangt af van het niveau van de beschrijving, het doel, de doelgroep waarmee gecommuniceerd wordt en het volwassenheidsniveau van de organisatie. Voor bedrijfs- en werkprocesniveau voldoet een basale methode als <strong>IDEF0</strong> meestal prima; bij veel interactie tussen mensen kan <strong>DEMO</strong> geschikt zijn. Voor gedetailleerde beschrijvingen die door niet-specialisten gelezen moeten worden, zijn niet-wiskundige methoden het meest geschikt; moeten processen naar ICT vertaald of gesimuleerd worden, dan zijn meer formele methoden beter geschikt.</p>

      <h4>3.9 Kanttekeningen bij procesmodellering</h4>
      <p>De kunst is om niet door te schieten in het vastleggen. Bezwaren tegen procesmodellering komen vaak voort uit een situatie waarin vastleggen doel op zich is geworden, zonder dat klanten of medewerkers daarbij gebaat zijn. Procesmodelleren moet zo veel mogelijk bij lijnmanagers worden belegd, niet alleen bij stafafdelingen, en de gekozen aanpak moet aansluiten bij de doelgroep — soms is het nodig niet strikt vast te houden aan de regels van een bepaalde methode. Niet alles laat zich beschrijven in procesmodellen: complexe processen zoals onderhandelingsprocessen zijn lastig te modelleren, zeker op lage detailniveaus; dan is het beter vooral de samenhang tussen resultaten weer te geven.</p>

      <h4>3.10 Conclusie</h4>
      <p>Dit hoofdstuk behandelde de basisbegrippen die nodig zijn om met procesmodellering aan de slag te gaan. Goede procesmodellen en beschrijvingen zijn onontbeerlijk: ze geven overzicht en inzicht, helpen in de communicatie, en maken het eenvoudiger om veranderingen aan te brengen. Afhankelijk van het doel kies je het niveau (keten-, bedrijfsproces-, werkproces- of executieniveau) en een methode zoals BPMN of IDEF; voor zeer complexe of onvoorspelbare processen komen andere methoden zoals DEMO in beeld. Dit was deel 1 van het boek — hoofdstuk 4 begint met het maken van een bedrijfsprocesmodel als beginpunt voor procesgericht organiseren in de praktijk.</p>

    summaryHtml: `
      <p><strong>Deel 2 — Processen als kapstok.</strong> De essentie van denken en doen in processen is de samenhang tussen doel en middel, tussen "het wat" en "het hoe", tussen verschillende activiteiten en tussen mens en hulpmiddel. Inzicht in die samenhang maakt het mogelijk de organisatie integraal en pro-actief te sturen op toegevoegde waarde, in plaats van ad hoc te reageren. In dit deel laat het boek zien hoe je een "proceskapstok" opzet: een aantal modellen en beschrijvingen die verschillende gezichtspunten (views) op de organisatie geven — zoals de ketenview en de bedrijfsprocessenview — waaraan allerlei keuzes worden "opgehangen". Hoofdstuk 4 behandelt het bedrijfsprocesmodel, hoofdstuk 5 de organisatiecultuur, en hoofdstuk 6 de procesarchitectuur. Elk hoofdstuk eindigt met een voorbeeld toegepast op het fictieve reisbureau De Zon.</p>
      <p><em>"It is not a question of how well each process works, the question is how well they all work together."</em> — Lloyd Dobyns en Clare Crawford-Mason, in: Thinking About Quality, 1994.</p>
      <p>Aan een startende ondernemer wordt vaak gevraagd: "Kun je in een paar woorden aangeven waarin jouw bedrijf zich onderscheidt?" Zo'n vraag zou je eigenlijk aan iedere manager en medewerker moeten kunnen stellen. De <strong>elevator pitch</strong> van de processenkapstok is het <strong>bedrijfsprocesmodel</strong>: hierin komt de essentie van de organisatie tot uitdrukking — een weergave van wat de organisatie wil betekenen voor de buitenwereld, vergelijkbaar met een businessmodel of (op het hoogste niveau) een target operating model.</p>

      <h4>4.1 Wat is een bedrijfsprocesmodel?</h4>
      <p>Een bedrijfsprocesmodel geeft een beeld van de processen van klant tot klant op het hoogste niveau en laat zien wat bepalend is voor het succesvol opereren van de organisatie. Het weerspiegelt strategische keuzes door die te vertalen naar:</p>
      <ul>
        <li>wat de belangrijkste toegevoegde waarden zijn die de organisatie aan de buitenwereld wil leveren;</li>
        <li>wat de belangrijkste klantgroepen zijn waaraan die toegevoegde waarden geleverd worden;</li>
        <li>hoe de voortbrenging van die waarden globaal verloopt;</li>
        <li>wat cruciaal is voor het succesvol leveren van die toegevoegde waarden — met nadruk op waarmee de organisatie zich onderscheidt van vergelijkbare organisaties.</li>
      </ul>
      <p>Figuur 4.1 toont een vereenvoudigd bedrijfsprocesmodel van een pensioenuitvoerder, met primaire processen als "bewerken markt", "afsluiten collectieve pensioencontracten", "beheren vermogen", "verzekeren risico's", "administreren contracten", "verlenen aanvullende diensten" en "uitkeren pensioenen", tussen het managen van klantrelaties (boven) en het beheren van hulpmiddelen (onder). Een bedrijfsprocesmodel hoeft niet per definitie de hele organisatie te omvatten — het kan ook voor een zelfstandig organisatieonderdeel worden opgesteld. Als klantgerichte processen over de grenzen van de organisatie heen lopen (bijvoorbeeld door uitbesteding of strategische partnerrelaties), kan het handig zijn een bredere scope te hanteren en te beginnen met een <strong>ketenbedrijfsprocesmodel</strong>. Het model geeft meestal de gewenste situatie weer, maar kan ook helpen de huidige situatie te verhelderen als startpunt voor verbetering.</p>

      <h4>4.2 Waaruit bestaat een bedrijfsprocesmodel?</h4>
      <p>Een bedrijfsprocesmodel bestaat enerzijds uit een of meer visuele weergaven: <strong>procesplaten</strong>. Deze zijn <strong>inrichtingsonafhankelijk</strong> — uit de beschrijving is niet op te maken door wie (welke afdeling/functionaris) en hoe (met welk systeem) processen worden uitgevoerd. Cruciaal is dat de platen goed leesbaar en visueel aantrekkelijk zijn, en laten zien hoeveel primaire processen de organisatie onderscheidt (meestal slechts enkele op het hoogste niveau). Besturende en ondersteunende processen worden meestal wel aangeduid, maar niet nader uitgewerkt, tenzij ze doorslaggevend zijn voor het succes. Naast de procesplaten bestaat het model uit een toelichting op de gemaakte keuzes en een korte typering van de onderdelen.</p>
      <p>Bij het bedrijfsprocesmodel is modelleren ondergeschikt aan de noodzakelijke <strong>communicatiekracht</strong>: een plaat moet eenvoudig te lezen zijn, ook voor mensen zonder procesachtergrond — ook al roept dat soms de reactie op "hebben jullie daar nu zo lang over gedaan?". Hoe hoger het niveau van procesbeschrijving, hoe lastiger het is om het eens te worden over de inhoud, maar des te eenvoudiger is het feitelijke modelleren. Om de inrichting verder vorm te geven wordt het bedrijfsprocesmodel uitgewerkt naar verschillende architectuurmodellen, waarvan de <strong>procesarchitectuur</strong> voor procesgericht organiseren een van de belangrijkste is.</p>

      <h4>4.3 Opstellen van een bedrijfsprocesmodel als onderdeel van strategieontwikkeling</h4>
      <p>Een bedrijfsprocesmodel kan zowel bottom-up (door het clusteren van onderkende activiteiten) als top-down tot stand komen. Voor een procesgerichte organisatie is een <strong>top-downaanpak</strong> — waarbij visie, strategie en doelstellingen vertaald worden naar een procesplaat — het meest logisch. Vaak moet eerst de strategie scherper gemaakt worden, bijvoorbeeld met een omgevingsanalyse, SWOT-analyse, een analyse van kerncompetenties (Prahalad en Hamel) of positioneringsonderzoek — met een focus op bijvoorbeeld operational excellence, product leadership, customer intimacy of een combinatie daarvan.</p>
      <p>Het opstellen van het bedrijfsprocesmodel moet gezien worden als een voortzetting van het strategietraject, niet als iets dat aan analisten of architecten kan worden overgelaten. Er moet voldoende interactie zijn met de strategische top, want bij het concretiseren van visie en strategie in een procesmodel blijkt vaak dat strategische keuzes nog niet scherp genoeg zijn — verheldering van strategische keuzes is dus een bijproduct van het opstellen van het bedrijfsprocesmodel.</p>

      <h4>4.4 Stappenplan om te komen tot een bedrijfsprocesmodel</h4>
      <p>Hoewel het opstellen geen puur analytisch proces is, biedt het boek een stappenplan als leidraad — flexibel toe te passen, want rigide hanteren werkt averechts:</p>
      <ol>
        <li><strong>Benoemen van klanten en andere belanghebbenden in de buitenwereld</strong> — voor wie willen wij iets betekenen? Dit geeft handvatten voor het indelen van processen in primaire, besturende en ondersteunende processen; de focus van het bedrijfsprocesmodel ligt op de primaire processen.</li>
        <li><strong>Benoemen van essentiële toegevoegde waarde per klantgroep</strong> — vaak wordt breder gekeken dan de directe klant, naar alle belanghebbenden (stakeholders).</li>
        <li><strong>Ordenen van klanten, toegevoegde waarde en producten tot waardestromen</strong> — een <strong>waardestroom</strong> is een visuele weergave van hoe betekenisvolle zaken worden opgeteld tot klantwaarde; het is een potentieel bedrijfsproces, maar niet hetzelfde — meerdere waardestromen kunnen worden samengevoegd tot één bedrijfsproces, of andersom.</li>
        <li><strong>Benoemen van onderscheidende competenties</strong> — per waardestroom wordt benoemd wat cruciaal is voor het succesvol creëren van toegevoegde waarde: de <strong>kritieke succesfactoren (KSF's)</strong>, geen vanzelfsprekendheden maar zaken die specifieke aandacht vragen.</li>
        <li><strong>Onderscheiden van bedrijfsprocessen</strong> — hierbij wordt gestreefd naar gelijkwaardige clusters van activiteiten, gewogen op overeenkomst in producten/markten, vergelijkbare KSF's, vergelijkbare procestypering en volume/belang. Om als bedrijfsproces te gelden moet een proces relatief autonoom zijn, en gericht op een extern product/dienst (<strong>primair</strong>), op sturing aan primaire processen (<strong>besturend</strong>), of op het in stand houden van middelen (<strong>facilitair</strong>). Een handig hulpmiddel hierbij is de typering naar productie-inrichting: <strong>make-to-stock</strong> (fabriceren en op voorraad leggen), <strong>assemble-to-order</strong> (assembleren van standaardcomponenten tot een klantspecifiek product), <strong>make-to-order</strong> (produceren na ontvangst van de order) en <strong>engineer-to-order</strong> (uniek productontwerp op basis van klantspecificaties). Essentieel is dat primaire bedrijfsprocessen van klant tot klant lopen, ondergeschikt aan organisatie- of afdelingsgrenzen.</li>
        <li><strong>Samenbrengen van de essentie in een visuele weergave</strong> — het mooiste is vaak één veelzeggende basisplaat (figuur 4.2), die laat zien welke onderliggende waardestromen en gedeelde werkprocessen er zijn. Een goede toetsvraag: geeft het model een helder beeld van de te creëren toegevoegde waarde, hoe activiteiten in samenhang zijn geordend, en wat per proces cruciaal is voor het onderscheidend vermogen?</li>
      </ol>

      <h4>4.5 Valkuilen bij het opstellen van een bedrijfsprocesmodel</h4>
      <ol>
        <li><strong>Analyse vanuit één discipline</strong> — het model mag niet het resultaat zijn van een analyse vanuit bijvoorbeeld alleen marketing of alleen operations, maar moet interdisciplinair tot stand komen. Toetsvraag: is het model tot stand gekomen in samenwerking met alle relevante disciplines?</li>
        <li><strong>Bedrijfsfuncties weergeven in plaats van bedrijfsprocessen</strong> — bedrijfsfuncties ordenen activiteiten naar specialisme, bedrijfsprocessen worden afgebakend op toegevoegde waarde; dit zijn niet dezelfde begrippen. Toetsvraag: geeft het model toegevoegdewaardestromen weer, of afzonderlijke informatiebehoeften?</li>
        <li><strong>Het model zo generiek maken dat de aard van de organisatie niet naar voren komt</strong> — door het hoge abstractieniveau kan het model zo algemeen worden dat het voor elke vergelijkbare organisatie zou kloppen. Toetsvraag: waaruit blijkt dat dit model invulling geeft aan de strategische uitgangspunten van juist deze organisatie?</li>
        <li><strong>Het model te gedetailleerd maken</strong> — alleen bedrijfsprocessen en hoofdkeuzes worden beschreven; werkprocessen worden slechts benoemd, de verdere uitwerking gebeurt in de procesarchitectuur (hoofdstuk 6).</li>
      </ol>
      <p>Andere valkuilen zijn generieker: te veel inhoud in één plaat (beter verschillende eenvoudige platen dan één complex model), en het niet consequent hanteren van naamgevingsconventies (werkwoord + zelfstandig naamwoord).</p>

      <h4>4.6 Voorbeeldcase: reisbureau De Zon International</h4>
      <p>De Zon International is 15 jaar geleden opgericht, snel gegroeid (25 vestigingen naast het hoofdkantoor), en behaalde haar winst van oudsher vooral met 6% commissie op vliegtickets. Doordat klanten steeds meer rechtstreeks bij luchtvaartmaatschappijen boeken, liep de winst terug, terwijl de interne organisatie sinds de groeiperiode nauwelijks is aangepast. De directie formuleerde een nieuwe missie: voor zakelijke klanten wil De Zon zich richten op grote internationale bedrijven die snel, correct en 24 uur per dag geholpen worden (met ontzorging als doel, inclusief personeelsreizen); voor particuliere klanten op avontuurlijke reizigers en een top-10-positie in groepsreizen.</p>
      <p><strong>Stap 1 — klanten/belanghebbenden:</strong> niet meteen opdelen in "particulier" versus "zakelijk" (dat is een valkuil), maar onderzoeken welke toegevoegde waarde gevraagd wordt. Zo worden zes klantgroepen onderscheiden: individuele zakelijke reizigers, collectieve zakelijke reizigers, organisatoren van collectieve zakelijke reizen, zakelijke opdrachtgevers, individuele particuliere reizigers en collectieve particuliere reizigers.</p>
      <p><strong>Stap 2 — toegevoegde waarde per klantgroep:</strong> bijvoorbeeld "comfortabel en tijdig vervoer, gemakkelijk boeken" voor individuele zakelijke reizigers, of "een leuke reis die niet te duur is" voor individuele particuliere reizigers.</p>
      <p><strong>Stap 3 — waardestromen:</strong> bijvoorbeeld de waardestroom "individuele zakelijke reizen", die loopt van goed advies en geboekt vervoer, via een correct en tijdig reisplan, naar een comfortabele individuele zakelijke reis.</p>
      <p><strong>Stap 4 — kritieke succesfactoren:</strong> flexibiliteit en gemak voor individuele zakelijke reizen; klantgerichtheid voor collectieve reizen; efficiency (lage kosten) voor individuele particuliere reizen; betrouwbaarheid voor het beheer van reisbeleid.</p>
      <p><strong>Stap 5 — bedrijfsprocessen:</strong> op basis van overeenkomsten in KSF's en procestype worden onderscheiden: "verzorgen particuliere individuele reizen" en "verzorgen zakelijke individuele reizen" (apart, want andere KSF's: lage kosten versus flexibiliteit/gemak); "verzorgen collectieve reizen" (individuele én collectieve groepsreizen samengevoegd, want zelfde KSF "klantgerichtheid" en zelfde dynamiek — inclusief het adviesproces, omdat 95% van de adviezen tot een boeking leidt); "beheren van reisbeleid" (apart, ander type proces, gericht op vastlegging van beslisregels); en "beheren relaties met zakelijke/particuliere klanten" (apart benoemd om het belang van klantrelaties te benadrukken).</p>
      <p><strong>Stap 6 — visuele weergave:</strong> de kernplaat (figuur 4.5) toont "de klant (vrager)" als startpunt, met sturende/specificerende processen (reisbureaufunctie voor bedrijven), primaire processen (de drie reis-processen) en ondersteunende processen (klantrelatiebeheer). Deze oefening maakt ook zichtbaar dat de strategie van De Zon mogelijk te breed is — iets wat de directie vervolgens bespreekt.</p>

      <h4>4.7 Conclusie</h4>
      <p>Een bedrijfsprocesmodel is een onmisbaar vertrekpunt en referentiekader om een organisatie in samenhang in te richten en te besturen. Het weerspiegelt de visie en strategische keuzes, laat zien welke toegevoegde waarde aan welke klantgroepen geleverd wordt, en welke bedrijfsprocessen daarvoor nodig zijn — de elevator pitch van de organisatie. Bij het opstellen kom je ook in aanraking met de cultuur van de organisatie: de beelden en termen die mensen van de organisatie hebben. Daarom is organisatiecultuur het onderwerp van het volgende hoofdstuk; pas daarna (hoofdstuk 6) wordt het bedrijfsprocesmodel verder uitgewerkt in een procesarchitectuur.</p>

  {
    id: 'h6',
    number: 6,
    title: 'De ruggengraat van procesgericht organiseren',
    subtitle: 'De procesarchitectuur',
    summaryHtml: `
      <p><em>"Processen zijn menselijke verzinsels om gewenste output te produceren."</em></p>
      <p>Een organisatievisie en -strategie vertalen naar een bedrijfsprocesmodel is niet eenvoudig, maar nog niet voldoende: bedrijfsprocessen staan niet los van elkaar. Mogelijk zijn er werkprocessen die voor meer bedrijfsprocessen van belang zijn (bijvoorbeeld het afhandelen van klantvragen of het verzorgen van financiële rapportages), of ICT-systemen die in verschillende bedrijfsprocessen worden gebruikt. Om die samenhang te bewaken en richting te geven, wordt steeds vaker de (uit de bouwwereld afkomstige) term "architectuur" gebruikt. In dit hoofdstuk gaat het specifiek om dat deel van het procesontwerp dat van belang is voor procesoverstijgende afspraken: de <strong>procesarchitectuur</strong>.</p>

      <h4>6.1 Ontstaan van de term "bedrijfsarchitectuur"</h4>
      <p>De term "architectuur" komt oorspronkelijk uit het vakgebied informatiemanagement, waar meer dan twintig jaar geleden het inzicht ontstond dat het belangrijk is de verschillende aspecten van een organisatie in samenhang te beschrijven om goede beslissingen over IT te kunnen nemen. Dit soort beschrijvingen ging "enterprisearchitecturen" of "bedrijfsarchitectuur" heten. De officiële TOGAF-definitie (gebaseerd op ANSI/IEEE 1471-2000): bedrijfsarchitectuur is de fundamentele opbouw van een organisatie, bestaande uit (1) haar componenten, (2) hun onderlinge relaties en die tot hun omgeving, en (3) de principes voor hun ontwerp en evolutie. John Zachman ontwikkelde een van de eerste aanpakken, het Enterprise Architecture Framework (EAF), met dertig "views" in een matrix; inmiddels bestaan er tal van raamwerken zoals TOGAF, xAF, EAB en (in Nederland) IAF.</p>
      <p>Het probleem met dit soort ICT-georiënteerde frameworks is niet dat er geen aandacht is voor processen — de procesmodellen erin zijn vaak goed bruikbaar voor het inrichten van de informatievoorziening — maar ze helpen minder bij het nadenken over besturing en organisatie-inrichting, en nog minder bij houding en gedrag van mensen en samenwerkingsrelaties. Typerend voor dit soort procesmodellen: (1) vooral processen met een grote rol voor geautomatiseerde systemen zijn beschreven; (2) processen worden beschreven als input-outputmodellen van informatiestromen; (3) de typering en ordening van processen is meestal functioneel, op basis van specialisme; (4) organisatieaspecten als cultuur, managementprincipes en competentieprofielen spelen nauwelijks een rol.</p>
      <p><strong>Functionele versus procesmatige ordening:</strong> bij een functionele ordening is de redenering "het is onhandig als op twee plekken hetzelfde werk op een verschillende manier wordt gedaan" — dus ontstaat bijvoorbeeld al snel één proces "facturering" voor zowel zakelijke als particuliere klanten. Bij een procesgerichte benadering wordt eerst gekeken naar de eisen die (met de klant als startpunt) aan elk van deze processen worden gesteld — waardoor bijvoorbeeld blijkt dat facturering voor particuliere klanten een eenvoudig, massaal en gestandaardiseerd proces is, terwijl het voor zakelijke klanten gaat om specialistisch factureren van maatwerkcontracten met veel klantcontact; dan is het niet logisch dit als één proces (met één systeem) te zien. Daarom is het nodig om procesgericht organiseren via een aparte procesarchitectuur uit te werken, op een andere manier dan informatiespecialisten gewend waren — wel moeten de beschrijvingen blijven aansluiten op wat voor de informatievoorziening van belang is.</p>

      <h4>6.2 Waarom een procesarchitectuur?</h4>
      <p>Met een procesarchitectuur wordt een consistente set van principes en modellen bedoeld die richting geeft aan ontwerp, realisatie en beheer van bedrijfsprocessen. Je kunt ermee:</p>
      <ul>
        <li>een beeld geven van het ideaalplaatje waar naartoe gewerkt wordt — dat helpt om koers te houden, of elk initiatief past in de richting waarnaartoe gewerkt wordt;</li>
        <li>samenhang brengen tussen alle aandachtsgebieden waarbij processen een rol spelen en die samenhang helpen bewaken: details kunnen worden uitgewerkt of aangepast, terwijl er zicht blijft op de grote lijnen, waardoor complexiteit beheersbaar blijft;</li>
        <li>snel inzicht geven in de consequenties van bijvoorbeeld een wetswijziging of een aanpassing van de dienstverlening.</li>
      </ul>
      <p>Een procesarchitectuur heeft een speciale functie: ze bewaakt niet alleen de samenhang tussen processen onderling, maar biedt ook een eenduidige kapstok voor alle aandachtsgebieden waarbij processen een rol spelen — bijvoorbeeld administratieve organisatie, kwaliteitszorg, regelgeving, HR en ondersteunende informatiesystemen. Dat is efficiënt: processen worden eenmaal in kaart gebracht en dit ene referentiekader wordt door verschillende specialisten gebruikt. Een procesarchitectuur vormt daarmee een referentiepunt en biedt handvatten voor het ontwerpen van processen op lagere niveaus en voor het bepalen van een veranderagenda.</p>

      <h4>6.3 Eisen waaraan een goede procesarchitectuur voldoet</h4>
      <p>Een procesarchitectuur heeft niet als eerste doel om een visie te verhelderen, zoals het bedrijfsprocesmodel, maar om keuzes te maken op basis van die visie. Daarom zijn bij een procesarchitectuur ontwerpeisen veel belangrijker dan bij het bedrijfsprocesmodel: uitwerkingen moeten zo min mogelijk ruimte laten voor interpretaties. De procesarchitectuur moet uiteraard aansluiten op het bedrijfsprocesmodel, zodat de hogere doelen niet uit het zicht raken. Principes en waarden die belangrijk zijn voor de organisatie (zoals verwoord in een missie of kernwaarden) moeten direct of indirect sturend zijn — direct bij het maken van keuzes tussen inrichtingsalternatieven, indirect doordat ze terugkomen in kritieke succesfactoren. Wat voor de ene organisatie een logische keuze is in haar architectuur, hoeft dat voor een andere organisatie niet te zijn.</p>
      <p>De procesarchitectuur geeft inzicht in welke processen er zijn, wat voor typen processen dat zijn en wat de samenhang daartussen is. De belangrijkste procesbeschrijvingen binnen een procesarchitectuur zijn de <strong>werkprocesbeschrijvingen</strong>: eerst het "wat" (de resultaten van werkprocessen — logische basis voor besturing, want resultaten zijn relevant voor de klant en dus waard om op te sturen), en vervolgens het "hoe" (welke processtappen in het werkproces worden uitgevoerd). Op basis van de beschreven werkprocessen kun je de verbinding maken met andere architecturen, zoals de producten- en dienstenarchitectuur, de organisatiestructuur of de informatiearchitectuur.</p>

      <h4>6.4 Procesarchitectuur in vijf stappen</h4>
      <p>De onderdelen van een procesarchitectuur (figuur 6.1) zijn tegelijk de vijf stappen voor het uitwerken ervan:</p>
      <ol>
        <li><strong>Vaststellen uitgangspunten voor procesmanagement</strong> — uitspraken over hoe de organisatie wil omgaan met haar processen: verantwoordelijkheden rond processen (zoals eigenaarschap en het beheer van procesbeschrijvingen), en de wijze waarop procesverbetering wordt vormgegeven (stroomlijning, herontwerp of verbetering; methoden zoals BPR, lean of Six Sigma — meestal is een gedifferentieerde benadering het beste). Voorbeeld: "elk proces heeft één eigenaar."</li>
        <li><strong>Vaststellen uitgangspunten voor vastlegging (modelleerprincipes)</strong> — hoe processen worden beschreven en gemodelleerd: tot op welk niveau, met welke standaarden/methodieken/conventies (bij voorkeur algemeen geaccepteerde, open standaarden), en bijvoorbeeld of processen gekoppeld moeten worden aan processen buiten de organisatie (ketenintegratie). Voorbeeld: "processen op ieder niveau hebben eenduidig gedefinieerde output."</li>
        <li><strong>Formuleren ontwerpprincipes</strong> — de inhoudelijke uitgangspunten voor het ontwerpen en uitwerken van bedrijfs- en werkprocessen, direct afgeleid van de strategie (bijvoorbeeld vastgelegd in het bedrijfsprocesmodel) of aanvullend geformuleerd. Vragen die hierbij spelen: hoe kijken we aan tegen selfservice door klanten? Wat moet er gebeuren bij onverwachte afwijkingen? Hoe wordt de regie over het procesverloop geregeld? Voorbeeld: binnen klant-tot-klantprocessen wordt een expliciet ontkoppelpunt gelegd tussen werkprocessen met klantinteractie (frontoffice) en zonder klantinteractie (backoffice), omdat deze een andere dynamiek en andere competenties vereisen.</li>
        <li><strong>Uitwerken van bedrijfs- en werkprocessen</strong> — een groot deel van de procesarchitectuur bestaat uit <strong>inrichtingsonafhankelijke</strong> beschrijvingen en procesplaten van bedrijfs- en werkprocessen: uit de beschrijving is niet op te maken door wie of met welk systeem processen worden uitgevoerd, en de beschrijving verandert niet als dat wijzigt. De bedrijfsprocessen uit het bedrijfsprocesmodel vormen het vertrekpunt en worden uitgewerkt in werkprocessen (met doelstellingen, resultaten, klanten/afnemers, triggers, kritieke succesfactoren en een typering — bijvoorbeeld naar aard/frequentie, standaard- of maatwerkproces, mate van automatisering). Vervolgens worden werkprocessen gedecomponeerd tot op het niveau van <strong>processtappen</strong> — een cluster samenhangende handelingen dat tot een betekenisvol tussenresultaat leidt, met onderscheid tussen volledig geautomatiseerde stappen (unattended), door een mens uitgevoerde en door systemen ondersteunde stappen (attended), en volledig handmatige stappen. Een bekende valkuil hierbij is het benoemen van bedrijfsfuncties in plaats van processen: bedrijfsfuncties worden afgebakend op samenhang in informatie, terwijl processen worden afgebakend op toegevoegde waarde en gewenste sturing.</li>
        <li><strong>Formuleren van inrichtingsprincipes</strong> — principes die leidend zijn voor de verdere inrichting van processen: het "hoe", bijvoorbeeld de mate van automatisering of de beoogde klantervaring. Omdat deze afhankelijk kunnen zijn van de typering van werkprocessen, is het handig gelijksoortige werkprocessen eerst te clusteren tot <strong>procesdomeinen</strong> (werkprocessen met dezelfde dynamiek en dezelfde KSF's), en per domein de belangrijkste inrichtingsprincipes te formuleren. Voorbeeld voor het domein "klantinteractieprocessen": de klant wordt in contacten herkend en gevolgd. Voorbeeld voor "administratieve processen": maximaal geautomatiseerde procesuitvoering (straight through processing).</li>
      </ol>

      <h4>6.5 Of gewoon een referentiemodel gebruiken?</h4>
      <p>Het uitwerken van processen is veel werk, en niet ieder werkproces is uniek voor de eigen organisatie — vandaar het ontstaan van procesreferentiemodellen of Business Process Frameworks, soms branchegericht (zoals eTOM voor telecom, SCOR voor logistieke ketens) en soms domeingericht (zoals ITIL, BiSL, of COPC voor callcenterprocessen). Referentiemodellen kunnen werk besparen en vergelijking tussen organisaties of benchmarking vergemakkelijken. Belangrijk is wel te bedenken dat je geen unieke organisatie bouwt met referentiemodellen — zeker het bedrijfsprocesmodel is juist bedoeld om de eigen visie tot uitdrukking te brengen. Een goed alternatief is referentieprocessen alleen te gebruiken voor de onderdelen van de procesarchitectuur waarin de organisatie niet onderscheidend wil zijn. Een ander probleem: referentiemodellen zijn soms meer functiemodellen (zoals eTOM) of meer voorbeelden van procedures (zoals ITIL) dan procesmodellen zoals in dit boek gedefinieerd — het gesprek moet gaan over hoe optimale waarde voor de klant geleverd kan worden, niet over de definities van een referentiemodel.</p>

      <h4>6.6 Procesarchitectuur en informatiearchitectuur</h4>
      <p>Bedrijfsarchitecturen zijn sinds de opkomst van de term meestal opgesteld vanuit een ICT-georiënteerde, functionele blik. Illustratie: een informatiearchitect en een procesarchitect wordt allebei gevraagd het intakeproces in een ziekenhuis in kaart te brengen. Voor de informatiearchitect is de relevante output: "correct en compleet vastgelegde informatie van de patiënt." Voor de procesarchitect is dat: "patiënt die opgenomen kan worden." Als procesmodellen deel uitmaken van een informatiearchitectuur, voldoen ze meestal niet aan de eisen voor procesgericht organiseren — ze zijn bruikbaarder voor het inrichten van de informatievoorziening dan voor andere inrichtingsaspecten. Idealiter gaat een procesarchitectuur vooraf aan een informatiearchitectuur, al kan de volgorde in de praktijk verschillen: ligt de strategische nadruk op informatieverwerking, dan kan het zinvol zijn eerst naar de informatiearchitectuur te kijken; ligt de nadruk op het samenbrengen van unieke talenten, dan is het logischer om van de procesarchitectuur uit te gaan.</p>

      <h4>6.7 Voorbeeldcase: reisbureau De Zon International</h4>
      <p>Het bedrijfsprocesmodel van De Zon (zie 4.6) vormt het startpunt voor de procesarchitectuur.</p>
      <p><strong>Stap 1:</strong> er wordt een kleine procesmanagementafdeling ingericht onder directe aansturing van de directie, die de directie ondersteunt bij het uitwerken van de procesarchitectuur. Voor ieder bedrijfsproces wordt een directielid eindverantwoordelijk, expliciet benoemd in de procesarchitectuur.</p>
      <p><strong>Stap 2:</strong> de BPM'ers stellen modelleerprincipes vast, bijvoorbeeld: het beschrijvingsniveau van door ICT ondersteunde processtappen moet voldoende zijn om rollen tot op autorisatieniveau te bepalen (Role Based Access Control); op bedrijfs- en werkprocesniveau wordt vastgelegd met IDEF-notatie, op procesflowniveau in principe met BPMN.</p>
      <p><strong>Stap 3:</strong> op basis van de strategie worden ontwerpprincipes geformuleerd (tabel 6.1), bijvoorbeeld: de klant kan zelf informatie over zijn reis online inzien en downloaden (reden: gemak voor de klant, efficiency voor De Zon); processen met veel klantinteractie worden apart benoemd, ingericht en bestuurd; geen klantcontacten in backofficeprocessen; informatie wordt eenmalig gevraagd en ingevoerd; bevoegdheden zijn zo belegd dat de klant in één keer goed geholpen kan worden.</p>
      <p><strong>Stap 4:</strong> voor het bedrijfsproces "verzorgen particuliere individuele reizen" worden de werkprocessen benoemd op basis van "de reis van de klant": bewerken markt → verkopen particuliere individuele reizen → organiseren reizen → uitvoeren reizen (te realiseren door ketenpartners) → financieel afhandelen reizen, met daarnaast verlenen service (figuur 6.2). Voor elk werkproces worden doel en kritieke succesfactor bepaald (tabel 6.2), bijvoorbeeld "organiseren reizen" (doel: alles regelen wat nodig is om de reis te maken, KSF: efficiency) en "verlenen service en nazorg" (KSF: openheid en sensitiviteit). Elk werkproces wordt vervolgens verder beschreven volgens een vast stramien (doel, resultaat, klantgroep, producten/diensten, typering, kritieke succesfactoren — tabel 6.3 en 6.4), tot op het niveau van processtappen. Generieke werkprocessen (zoals "beheren relaties met particuliere klanten" en "factureren gemaakte reizen individuele zakelijke reizigers", met vergelijkbare KSF's en procestype) worden samengenomen.</p>
      <p><strong>Stap 5:</strong> De Zon clustert werkprocessen tot procesdomeinen: klantinteractieprocessen (veel klantinteractie, ongestructureerde input — bijv. verkopen particuliere reis, verlenen service), administratieve processen (standaard procesverloop — bijv. organiseren particuliere reis, beheren klantgegevens), financiële processen (nadruk op financiële gegevens en risico's) en innovatieprocessen (gericht op innovatie en verbetering). Per domein worden inrichtingsprincipes geformuleerd (tabel 6.5), bijvoorbeeld voor klantinteractieprocessen: "de klant wordt in één keer goed geholpen (niet 'van het kastje naar de muur')"; voor financiële processen: "dubbelchecks, borging van risico's."</p>

      <h4>6.8 Conclusie</h4>
      <p>De procesarchitectuur vertaalt de visie en strategie van een organisatie naar concrete kaders voor de inrichting van processen. Een goede procesarchitectuur biedt daarmee een eenduidige kapstok voor alle aandachtsgebieden waarbij processen een rol spelen, zoals administratieve organisatie, kwaliteitszorg, regelgeving, HR, besturing, organisatiearchitectuur en ondersteunende informatiesystemen. De procesarchitectuur helpt de organisatie koers te houden, brengt samenhang tussen al deze aandachtsgebieden, helpt die samenhang bewaken en geeft snel inzicht in de consequenties van veranderingen.</p>
      <p>Een procesarchitectuur omvat (1) uitgangspunten voor procesmanagement, (2) standaarden voor en eisen aan procesmodellering, (3) ontwerpprincipes, (4) beschrijvingen van bedrijfs- en werkprocessen en (5) principes voor het inrichten van processen (het "hoe"). De uitwerking moet zo min mogelijk ruimte laten voor interpretaties. Waar het bedrijfsprocesmodel als doel heeft een visie te verhelderen, dient de procesarchitectuur om eenduidige ontwerpkeuzes te maken op basis van die visie. Samen met het bedrijfsprocesmodel en inzicht in de huidige en gewenste cultuur vormt de procesarchitectuur de "processenkapstok" — de basis voor de inrichtingskeuzes die in deel 3 van het boek worden besproken.</p>
