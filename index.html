  {
    id: 'h7',
    number: 7,
    title: 'Aan welke knoppen kun je draaien?',
    subtitle: 'Procesgerichte besturing opzetten met behulp van de proceskapstok',
    summaryHtml: `
      <p><em>"Meten is weten, of... precisie zonder visie?"</em></p>
      <p>Processen worden vaak in één adem genoemd met procesmanagement — maar ook bij procesgericht organiseren is aparte aandacht nodig voor het inrichten van de besturing van die processen. Dit hoofdstuk gaat over <strong>processturing</strong>: de min of meer gestructureerde activiteiten die tot doel hebben processen te laten slagen in het realiseren van de doelen waarvoor ze zijn ingericht.</p>

      <h4>7.1 Essentie van besturing</h4>
      <p>Een goede basis is het bekende <strong>besturingsparadigma van De Leeuw (1990)</strong>: de omgeving, het besturend orgaan en het bestuurd systeem staan met elkaar in verbinding. De organisatie, het proces of wat dan ook waaraan sturing wordt gegeven, is het "bestuurd systeem". Dit bestuurd systeem heeft te maken met een omgeving waarmee afstemming gezocht moet worden en waarmee uitwisseling plaatsvindt (bijvoorbeeld klantvragen die binnenkomen en diensten die naar buiten gaan). Besturing vindt plaats vanuit een "besturend orgaan" — dat kan een aparte organisatie(onderdeel) zijn, maar ook gewoon een rol binnen de eenheid zelf. Het besturend orgaan vergaart informatie over de behoeften van de omgeving, geeft op basis daarvan sturing aan het bestuurd systeem, krijgt feedback over het effect en stuurt op basis daarvan weer bij. Dit voortdurend bijsturen heet een <strong>regelkring</strong>. Omdat hierbij heel wat kan misgaan, zijn er vijf voorwaarden geformuleerd die nodig zijn om effectief te kunnen sturen:</p>
      <ol>
        <li><strong>Een model van het bestuurd systeem</strong> — om de effecten van stuurmaatregelen te kunnen voorspellen, moet het besturend orgaan een goed beeld hebben van de structuur en werking van het bestuurd systeem.</li>
        <li><strong>Heldere doelen</strong> — het bestuurd systeem moet een beoogd resultaat hebben; dat hoeft niet per se expliciet beschreven of constant te zijn, maar er moet wel een richting zijn waarin gestuurd kan worden.</li>
        <li><strong>Informatie over de omgeving en over de toestand van het systeem</strong> — nodig om effectief te kunnen besturen.</li>
        <li><strong>Capaciteit van informatieverwerking</strong> — binnenkomende informatie moet adequaat verwerkt kunnen worden; een overload aan informatie is niet effectief.</li>
        <li><strong>Voldoende stuurmaatregelen</strong> — meten heeft alleen zin als er ook actie op ondernomen kan worden; het aantal beschikbare stuurmaatregelen moet in goede verhouding staan tot het aantal omstandigheden dat zich kan voordoen.</li>
      </ol>

      <h4>7.2 Traditionele besturing</h4>
      <p>Cruciaal bij besturing is het mentale model dat het besturend orgaan hanteert voor het bestuurde systeem. Soms (vaak onbewust) is dit het beeld van een <strong>geldmachine</strong>, met sturing vooral op economische en financiële variabelen — en de meeste macht bij het deel van het management met de grootste budgetten. Het andere uiterste is de organisatie beschouwen als <strong>sociaal systeem</strong>: mensen aan wie leiding gegeven wordt, met de nadruk op inspirerend leiderschap.</p>
      <p>De voor de hand liggende visie vanuit een procesmanagementoptiek is de organisatie te beschouwen als een <strong>set van processen</strong>. Het cruciale verschil met de gangbare inrichting: besturing is niet meer gebaseerd op doelstellingen van businessunits, afdelingen, bedrijfsfuncties of individuele managers, maar per definitie afdelings- en disciplineoverstijgend en gebaseerd op procesdoelstellingen.</p>
      <p>De valkuil hierbij is een klassieke, tayloriaanse procesmanagementbenadering: de organisatie als mechanisch raderwerk dat doelgericht gestuurd kan worden. Dit past misschien bij organisaties met uitsluitend gestandaardiseerde productie- of geautomatiseerde processen, maar schiet tekort bij dienstverlenende organisaties waarin contacten tussen mensen een rol spelen — en al helemaal bij organisaties waarin cliënten als het ware deel uitmaken van het systeem, zoals in de zorgsector. In dit soort organisaties werkt een mechanistische visie averechts: het besturend orgaan is geneigd steeds meer beheersing toe te voegen (meer informatie, regels, standaarden, maatregelen) totdat de tegenreactie zo groot wordt dat alle beschrijvingen en systemen weer in de kast verdwijnen.</p>
      <p>Gelukkig kan het ook anders. Tegen het einde van de twintigste eeuw ontstond het besef dat financiële gegevens wel aangeven hoe het in het verleden ging, maar weinig voorspellen over de toekomst. Als alternatief kwam de <strong>balanced-scorecardmethode</strong> in zwang: een overzichtelijk dashboard dat de bedrijfsstrategie vertaalt naar indicatoren vanuit vier perspectieven (figuur 7.2): het <strong>financieel perspectief</strong> ("Hoe zien we eruit voor aandeelhouders en andere financiers?"), het <strong>klantperspectief</strong> ("Hoe zien onze klanten ons?"), het <strong>interne perspectief</strong> ("Op welk gebied moeten we de eigen prestaties verbeteren?") en het <strong>innovatieperspectief</strong> ("Hoe kunnen we blijven verbeteren en groeien?").</p>

      <h4>7.3 Procesgerichte keuzes bij het ontwerpen en inrichten van de besturing</h4>
      <p>In de visie op procesmanagement wordt het te besturen systeem beschouwd als een cluster klantgeoriënteerde processen met een groot <strong>zelfsturend vermogen</strong>, doordat er mensen in werkzaam zijn met het vermogen om hetgeen ze doen bij te sturen. De rol van het besturend orgaan moet vooral gericht zijn op het afstemmen op doelen en het faciliteren van het bestuurd systeem om optimaal te kunnen werken.</p>
      <p>Uitgangspunt in een procesgerichte organisatie is dat de afgesproken doelstellingen voor het proces leidend zijn en dat verantwoordelijkheden zo laag mogelijk in de organisatie worden gelegd. Verantwoordelijkheden en bevoegdheden worden niet gedetailleerd vastgelegd, maar er worden kaders afgesproken waarbinnen ieder individu en ieder team verantwoordelijk is voor het eigen handelen, en verantwoording moet kunnen afleggen over genomen beslissingen, gegeven adviezen en het resultaat van het handelen.</p>
      <h4>7.3.1 Proceseigenaarschap</h4>
      <p>Het boek noemt proceseigenaarschap een van de belangrijkste aspecten van procesgerichte besturing. Veel organisaties die aan de slag gaan met procesgericht organiseren benoemen zogenaamde <strong>proceseigenaren</strong>, maar het is daarbij niet altijd duidelijk wat daar precies mee wordt bedoeld en wat er van de persoon wordt verwacht. Alleen stellen dat iemand vanaf nu verantwoordelijk is voor een (al dan niet afdelingsoverstijgend) proces is onvoldoende; meer uitleg is nodig, al is het maar omdat verschillende organisaties er iets anders onder verstaan. Dat begint al met de naam: naast "proceseigenaar" komen ook de termen <strong>procesmanager</strong>, <strong>procesbeheerder</strong>, <strong>procesadaptant</strong> en zelfs <strong>procesdirecteur</strong> voor, zonder dat duidelijk wordt wat het verschil is.</p>
      <p><strong>Verantwoordelijkheden van de proceseigenaar.</strong> De verantwoordelijkheden van proceseigenaren (of hoe een verantwoordelijke voor processen ook genoemd wordt) lopen normaal gesproken parallel met de groei in procesvolwassenheid van de organisatie. In een klassieke, functioneel ingerichte organisatie bestaat vaak een onderscheid tussen <strong>stafrollen</strong> (die in meer of mindere mate leidend zijn bij de organisatie van het werk) en <strong>lijnmanagement</strong> (voor de uitvoering daarvan). Voor de invulling van proceseigenaarschap wordt onderscheid gemaakt tussen vier verantwoordelijkheden:</p>
      <ul>
        <li><strong>Procesvastlegging</strong> — de verantwoordelijkheid voor de aanwezigheid en juistheid van procesbeschrijvingen voor een bepaald domein of een bepaalde afdeling.</li>
        <li><strong>Procesontwikkeling</strong> — de verantwoordelijkheid voor de opzet, inrichting, herinrichting of stroomlijning van processen: het ontwerp en de verbetering van het proces zelf.</li>
        <li><strong>Procesimplementatie</strong> — de verantwoordelijkheid voor het invoeren van een ontworpen proces en verbeteringen, inclusief de verantwoordelijkheid voor interne audits waarmee aangetoond wordt dat het proces werkt.</li>
        <li><strong>Procesbesturing</strong> — de verantwoordelijkheid voor de eindresultaten van het proces: de operationele beheersing en logistieke aspecten van het resultaat (kwaliteit, tijd) en het resourceverbruik (mensen, middelen), en de tactische en operationele besluitvorming bij de uitvoering van het proces.</li>
      </ul>
      <p>Op enig moment ontstaat een mengvorm van (1) de algemene en hiërarchische verantwoordelijkheden conform de organisatiestructuur en (2) de procesverantwoordelijkheden conform de processtructuur. Voor complexere bedrijfsprocessen die over verschillende organisatieonderdelen heen lopen, zal er vaak een vorm van <strong>proceseigenaarschap</strong> zijn op bedrijfsprocesniveau (bijvoorbeeld "procesdirecteuren") én op werkprocesniveau. De proceseigenaren van werkprocessen zijn verantwoordelijk voor de resultaten van hun werkproces (soms "procesmanager" genoemd), de proceseigenaar van het totale bedrijfsproces draagt verantwoordelijkheid voor het eindresultaat. Tussen proceseigenaren van werkprocessen kunnen Service Level Agreements (SLA's) worden afgesproken over de onderlinge dienstverlening.</p>
      <p>De proceseigenaar van een afdelingsoverstijgend werk- of bedrijfsproces bemoeit zich niet per se met het werk van iedere afdeling, maar richt zich vooral op de mate waarin KPI's worden gehaald (met speciale aandacht voor doorlooptijden), op overdrachtspunten tussen afdelingen, en op het monitoren van de relatie met de buitenwereld: heeft het proces (nog) de beoogde toegevoegde waarde? Belangrijk: proceseigenaarschap mag niet bij een stafmedewerker worden belegd — de proceseigenaar moet voldoende bevoegdheden hebben om afdelingsmanagers aan te spreken, en is daarom meestal op managementniveau belegd.</p>
      <p>Het boek onderscheidt drie typen proceseigenaarschap (figuur 7.3):</p>
      <ul>
        <li><strong>Type 1</strong> — procesontwikkelings- en implementatieverantwoordelijkheid.</li>
        <li><strong>Type 2</strong> (meest gebruikelijk) — ook procesbesturingsverantwoordelijkheid, vaak gekoppeld aan verantwoordelijkheid voor ontwikkeling en implementatie (om op resultaat te kunnen sturen, moet de proceseigenaar ook aanpassingen in het ontwerp kunnen doorvoeren).</li>
        <li><strong>Type 3</strong> — proceseigenaren die ook "lijnverantwoordelijk" zijn en over de inzet van mensen en middelen beschikken. Bij type 1 en 2 kan de bestaande organisatie nog gewoon in stand blijven; bij type 3 "kantelt" de oude hiërarchische lijnorganisatie en volgt deze de indeling naar processen.</li>
      </ul>
      <p>Goed functionerend proceseigenaarschap is een van de belangrijkste sleutels voor het beheersen en verbeteren van processen — tegelijk blijkt het één van de lastigste aspecten van procesgericht organiseren om goed tot leven te brengen.</p>

      <h4>7.3.2 Hoe de voorwaarden voor effectieve besturing worden ingevuld door procesgericht organiseren</h4>
      <p><strong>Voorwaarde 1 (model van het bestuurd systeem):</strong> procesmodellen zijn het ideale model van het bestuurd systeem, zeker als dit de vorm heeft van een proceskapstok, waarmee de samenhang tussen toegevoegde waarde op het hoogste niveau en procesinrichting/-uitvoering zichtbaar wordt. Goed inzicht in processen maakt het mogelijk te voorspellen welke (bij)sturingsmaatregelen effectief zijn.</p>
      <p><strong>Voorwaarde 2 (heldere doelen):</strong> het expliciet vastleggen van beoogde resultaten is kernpunt bij het ontwerpen van processen — bij voorkeur SMART. Een <strong>doelstellingenhiërarchie</strong> (een stelsel van hogere en lagere doelstellingen, waarin lagere doelstellingen eenduidig zijn afgeleid van hogere) zorgt voor samenhang: bedrijfsdoelstellingen worden vertaald naar doelstellingen voor bedrijfsprocessen, en van daaruit weer naar doelstellingen voor werkprocessen, zodat alle activiteiten gericht blijven op een (proces)resultaat voor de klant.</p>
      <p><strong>Voorwaarde 3 (informatie over omgeving en systeemtoestand):</strong> als basis dienen kritieke succesfactoren en kritieke prestatie-indicatoren. Een <strong>kritieke succesfactor (KSF)</strong> is een factor die van doorslaggevende betekenis is voor het bereiken van een procesdoel (bijvoorbeeld transactiekosten of kwaliteit van de input bij een efficiënt administratief proces). Een <strong>kritieke prestatie-indicator (KPI)</strong> is afgeleid van een KSF en bestaat uit een meetbare grootheid (de "meter"), een norm en een meetprocedure — KPI's "operationaliseren" de KSF's. Er zijn drie typen proces-KPI's: <strong>inputindicatoren</strong> (hoeveel/welke kwaliteit input wordt geleverd), <strong>throughputindicatoren</strong> (hoe goed het proces verloopt) en <strong>outputindicatoren</strong> (het eindresultaat). Elke KPI moet een eigenaar hebben; door KPI's vanuit processen te definiëren en bij de proceseigenaar te beleggen, wordt voorkomen dat afdelings-KPI's samen niet tot het beste klantresultaat leiden. Ook op procesniveau kan de balanced scorecard goed gebruikt worden.</p>
      <p><strong>Voorwaarde 4 (capaciteit van informatieverwerking):</strong> in een procesgerichte organisatie wordt veel aandacht besteed aan het inrichten van besturende processen, met expliciet belegde verantwoordelijkheid. Een belangrijke verschuiving: "planning en control" (P&C) is niet meer alleen een taak van de controller, maar van alle proceseigenaren. Informatiesystemen spelen een rol bij de verwerkingscapaciteit, maar te veel data kan juist tot meer behoefte aan verwerkingscapaciteit leiden (de bomen door het bos niet meer zien) en tot interpretatieproblemen. Managers moeten bovendien oppassen niet te veel te vertrouwen op geaggregeerde cijfers: echt sturen vraagt voldoende feeling met het proces zelf.</p>
      <p><strong>Voorwaarde 5 (voldoende stuurmaatregelen):</strong> sturing kan zich richten op het proces als geheel — <strong>inputsturing</strong> (bijv. budget of beleidskaders), <strong>throughputsturing</strong> (regels voor de uitvoering) of <strong>outputsturing</strong> (kwaliteitseisen aan het resultaat) — of op het proces als samenhangend geheel van activiteiten: <strong>feedbacksturing</strong> (leerervaringen uit eerder procesverloop gebruiken) of <strong>feedforwardsturing</strong> (inputsturing op basis van kennis van het proces tot dan toe, bijvoorbeeld een waarschuwing). Welke stuurmaatregelen mogelijk zijn hangt af van de mate waarin de procesprestaties eenduidig meetbaar zijn en de mate waarin het proces eenduidig/voorspelbaar verloopt (figuur 7.5): bij een onduidelijk proces met niet-eenduidig resultaat zal sturing vaker het karakter van inputsturing hebben.</p>

      <h4>7.3.3 Besturing is meer dan de invulling van een regelkring</h4>
      <p>De regelkring is gebaseerd op het sturen van mensen van buitenaf, vaak via belonen en straffen. Maar sturing van binnenuit is minstens zo belangrijk, zeker bij professionals: idealiter hebben mensen zelf zoveel informatie en kennis dat vanzelfsprekend het meest gewenste gedrag wordt vertoond — een zeer efficiënte vorm van sturing, waarbij het effect vaak verder gaat doordat in de uitvoering manieren worden gevonden om het proces te verbeteren.</p>
      <p>Een procesgerichte organisatie combineert sturing vanuit het besturend orgaan (<strong>outside-insturing</strong>) met sturing vanuit mensen die direct betrokken zijn bij de procesuitvoering (<strong>inside-outsturing</strong>). De optimale mix hangt af van het type organisatie en de cultuur. Voor outside-insturing is de proceskapstok direct bruikbaar; inside-outsturing heeft kennis en vaardigheden van mensen als aangrijpingspunt en vereist een organisatiecultuur met passende waarden en normen — dit krijgt geen vorm op papier, maar is alleen mogelijk met een passende organisatie-inrichting en -cultuur. Omdat elke vorm van sturing invloed heeft op houding en gedrag, moet een organisatie zich regelmatig afvragen of outside-insturing nog wel effectief is — bijvoorbeeld aan de hand van de vraag of medewerkers hun best doen of alleen proberen niets fout te doen, of ze om hulp vragen of met excuses komen, en of ze problemen bespreken of de indicatoren verbeteren in plaats van ermee knoeien.</p>

      <h4>7.4 Hoe de proceskapstok helpt bij het inrichten van procesgerichte besturing</h4>
      <p>Aan de hand van de proceskapstok kunnen twaalf stappen worden gezet om tot procesgerichte besturing te komen, elk gekoppeld aan een onderdeel van de proceskapstok:</p>
      <ol>
        <li><strong>Formuleren van te behalen resultaten op ketenniveau</strong> (ketenmodel) — de beoogde resultaten van de waardeketen vormen de context; in afstemming met ketenpartners worden gewenste prestatieniveaus geformuleerd.</li>
        <li><strong>Formuleren van eisen aan besturing en afstemming binnen de waardeketen</strong> (ketenmodel) — welke besturing en afstemming zijn nodig met toeleveranciers en afnemers: waar ligt de regie, hoe werken we samen, hoe zoeken we voortdurend naar optimalisatie?</li>
        <li><strong>Bepalen van het besturingsconcept</strong> (bedrijfsprocesmodel) — de balans tussen outside-insturing en inside-outsturing, gedifferentieerd naar het type proces; ook de keuze voor proceseigenaarschap type 1/2 of 3. Aandachtspunt: hoe ver gaan we in <strong>empowerment</strong> (bevoegdheden zo laag mogelijk leggen, met de bijbehorende kennis, informatie en hulpmiddelen)?</li>
        <li><strong>Inrichten van een of meer besturende processen</strong> (bedrijfsprocesmodel) — vooral voor langcyclische besturing: het verzamelen van informatie over ontwikkelingen, het formuleren/bijstellen van doelen en plannen, het monitoren en evalueren van procesprestaties, het nemen van besluiten over bijsturing, en het implementeren van bijsturingsmaatregelen.</li>
        <li><strong>Inrichten van de door een besturend orgaan in te vullen rollen op bedrijfsprocesniveau</strong> (bedrijfsprocesmodel) — proceseigenaarschap beleggen, met directieleden rechtstreeks verantwoordelijk voor klantresultaten.</li>
        <li><strong>Bepalen van doelen per bedrijfsproces</strong> (bedrijfsprocesmodel) — afgeleid van de strategie, bij voorkeur SMART (Specifiek, Meetbaar, Acceptabel, Realistisch, Tijdgebonden).</li>
        <li><strong>Bepalen van bijbehorende KSF's en KPI's per bedrijfsproces</strong> (bedrijfsprocesmodel) — via een methode van 2-5 KSF's per bedrijfsproces, 1-3 KPI's per KSF, 1-3 normen per KPI en 1-2 meetprocedures per norm.</li>
        <li><strong>Bepalen van te behalen resultaten per werkproces</strong> (procesarchitectuur) — een doelstellingenhiërarchie helpt de samenhang te bewaken.</li>
        <li><strong>Bepalen van bijbehorende KSF's en KPI's per werkproces</strong> (procesarchitectuur), passend bij het besturingsconcept — afdelings-KPI's (gericht op efficiency) en proces-KPI's (gericht op effectiviteit) kunnen gecombineerd worden (figuur 7.6).</li>
        <li><strong>Bepalen van de mate van concentratie versus decentralisatie</strong> (procesarchitectuur) — wat wordt centraal besloten, wat decentraal, en hoe zijn bevoegdheden verdeeld?</li>
        <li><strong>Inrichten van de door een besturend orgaan in te vullen rollen op werkprocesniveau</strong> (procesarchitectuur) — bijvoorbeeld proceseigenaarschap gericht op het signaleren van afwijkingen en voorstellen van maatregelen.</li>
        <li><strong>Bepalen van te behalen resultaten op het niveau van processtappen</strong> (procesflows) — het liefst zo veel mogelijk SMART geformuleerd.</li>
      </ol>

      <h4>7.5 Voorbeeldcase: reisbureau De Zon International</h4>
      <p>De Zon doorloopt het stappenplan: op <strong>ketenniveau</strong> (stap 1-2) worden via brancheorganisaties minimumeisen afgesproken, en maakt de directie met belangrijkste leveranciers afspraken over overdrachtsmomenten, monitoring en rapportage. Bij het <strong>besturingsconcept</strong> (stap 3) kiest de directie voortaan alleen op hoofdlijnen van bovenaf te sturen, met een sterke focus op inside-outsturing — gefaseerd ingevoerd over een groeipad van twee jaar. Voor <strong>besturende processen</strong> (stap 4) wordt het project "Inrichten stuurprocessen" gestart. Voor <strong>proceseigenaarschap op bedrijfsprocesniveau</strong> (stap 5) kiest De Zon in fase 1 voor type 2 (elk directielid verantwoordelijk voor het verbeteren, implementeren en besturen van de klant-tot-klantprocessen, met een afdelingsoverstijgend verbeterteam), en in fase 2 voor type 3 (proceseigenaren worden ook hiërarchisch verantwoordelijk).</p>
      <p>Voor <strong>doelen, KSF's en KPI's per bedrijfsproces</strong> (stap 6-7) wordt bijvoorbeeld voor "Verzorgen collectieve reizen" het doel geformuleerd dat minstens 90% van de deelnemers een rapportcijfer van 7,5 of hoger geeft, met KSF's klantgerichtheid en gemak, en KPI's als klanttevredenheid over de groepsreis en het percentage nieuwe verkopen op basis van aanbeveling (norm: 20% of hoger per kwartaal). Op <strong>werkprocesniveau</strong> (stap 8-9) wordt onder meer de KPI "verbredingstijd" per afdeling toegevoegd, om afdelingsoverstijgend denken te stimuleren via meeloopdagen en interne stages. Bij <strong>concentratie versus decentralisatie</strong> (stap 10) komt meer beslissingsbevoegdheid bij afdelingen en teams te liggen, wat de slagkracht van de organisatie vergroot. Op <strong>werkprocesniveau</strong> (stap 11) stuurt de afdelingsmanager als werkproceseigenaar, met verbetersuggesties elke twee weken op de agenda van het werkoverleg. Tot slot worden op het niveau van <strong>processtappen</strong> (stap 12) concrete, meetbare resultaten afgesproken, grotendeels door de medewerkers zelf vastgesteld.</p>

      <h4>7.6 Conclusie</h4>
      <p>Onder processturing verstaan we de min of meer gestructureerde activiteiten die tot doel hebben processen te laten slagen in het realiseren van de doelen waarvoor ze zijn ingericht. De organisatie wordt beschouwd als een cluster van klantgeoriënteerde processen met een groot zelfsturend vermogen. Een procesgerichte organisatie kenmerkt zich door een combinatie van <strong>outside-insturing</strong> (vanuit het besturend orgaan, per definitie afdelings- en disciplineoverstijgend en gebaseerd op procesdoelstellingen, met goed functionerend proceseigenaarschap als basis) en <strong>inside-outsturing</strong> (door mensen te verbinden met de doelstellingen van de organisatie, door een organisatie-inrichting die verantwoordelijkheden laag legt, en door een cultuur waarin mensen vanuit intrinsieke motivatie het gewenste gedrag vertonen). Met behulp van de proceskapstok kan in twaalf stappen de besturing van een procesgerichte organisatie worden opgezet. Het volgende hoofdstuk gaat over wat procesgericht organiseren betekent voor het ontwerpen en inrichten van de organisatie zelf.</p>

    title: 'Een organisatie veranderen doe je niet op papier',
    subtitle: 'Procesgericht organiseren als veranderproces',
    summaryHtml: `
      <p><em>"Mensen leren als ze ervaren dat oude routines niet werken."</em></p>
      <p>Managers zeggen vaak dat ze al heel ver zijn met procesmanagement: er is een afdeling, een uitgewerkte en beheerde procesarchitectuur, benoemde proceseigenaren, gemeten KPI's en moderne ICT-tools. Toch blijken zulke organisaties nog te kampen met klassieke problemen: de klanttevredenheid is niet verrassend hoog, kosten blijven hoog en veranderingsprocessen verlopen moeizaam. De meest gehoorde verklaring is dat men "er niet aan toe is" of dat "de organisatie niet mee wil". Dat is niet zo gek, want <strong>denken, doen en werken in processen is meer dan een optelsom van procesgerichte inrichtingskeuzes</strong>. Ook het doorvoeren van een procesgerichte organisatiestructuur en procesgerichte vormen van besturing, beheersing en informatievoorziening leidt niet vanzelf tot de gewenste veranderingen. Procesgericht organiseren vraagt vaak om andere samenwerkingsrelaties, een andere manier van leidinggeven en een andere houding en ander gedrag, en raakt daarmee aan aspecten van de organisatie die niet eenvoudig te veranderen zijn. Dit hoofdstuk beschrijft wat nodig is om die veranderingen op gang te krijgen, en omgekeerd wat een aanpak via processen kan bijdragen aan succesvol veranderen.</p>

      <h4>11.1 Kern van veranderen richting grotere procesgerichtheid</h4>
      <p>De ontwikkeling richting procesgerichtheid verloopt bij elke organisatie anders, maar er zijn <strong>drie kernpunten</strong> die altijd een rol spelen:</p>
      <ol>
        <li><strong>Klantgedrevenheid</strong></li>
        <li><strong>Verbeteringsgerichtheid</strong> (in dit hoofdstuk vooral nadrukkelijk aan de orde)</li>
        <li><strong>Samenwerkingsgerichtheid</strong> — noodzakelijk omdat bij procesgericht organiseren veel gebaseerd is op als team verantwoordelijkheid nemen. Dat vereist dat je als individu je rol binnen een team kunt invullen.</li>
      </ol>
      <p>Dit vraagt drie <strong>omslagen</strong>: van denken in taken naar denken in processen en resultaten; van denken in hokjes naar transparantie; van formele macht naar informele macht (bijvoorbeeld gebaseerd op klantcontacten). De verandertrajecten die nodig zijn voor zulke mentale veranderingen zijn niet eenvoudig: uit onderzoek blijkt dat van deze organisatieveranderingsprogramma's <strong>minstens zeventig procent</strong> de gestelde doelen niet haalt.</p>

      <h4>11.2 Typering verandertrajecten algemeen</h4>
      <p>Bij veranderprocessen wordt vaak onderscheid gemaakt tussen de "harde" kant (systemen, besturing, procedures, ICT) en de "zachte" kant (organisatie- en cultuuraspecten, waar mensen aan te pas komen). Het onderscheid ligt veel complexer: veranderingen die mensen ondergaan zijn vaak veel "harder" dan andere veranderingen en kunnen zelfs gelijkenis vertonen met een rouwproces. In dit boek beperkt men zich tot een simpele tweedeling: <strong>koude</strong> en <strong>warme</strong> verandertrajecten.</p>
      <ul>
        <li><strong>Koude organisatieverandering:</strong> van het type reorganisatie, gericht op de organisatiestructuur, zoals het schrappen of samenvoegen van afdelingen of functies, het veranderen van de managementstructuur of verantwoordelijkheidsverdeling, of het overnemen en integreren van een andere organisatie. De achterliggende visie is die van een <strong>machine met een raderwerk</strong> dat zo goed mogelijk moet draaien: onderdelen kun je rationeel vervangen, toevoegen en wat werking en functie betreft veranderen.</li>
        <li><strong>Warme organisatieverandering:</strong> een benadering meer gericht op <strong>leren dan op maken</strong>, op de mens in plaats van op systemen of structuren. Voorbeelden: het introduceren van (meer) coachend leiderschap, het vergroten van kwaliteitsbewustzijn, het verbeteren van samenwerkingscompetenties of het vergroten van klantgerichtheid. De organisatie wordt gezien als een <strong>levend geheel</strong> in voortdurende wisselwerking met zijn omgeving, de metafoor van een organisatie als mens.</li>
      </ul>
      <p>Het onderscheid warm/koud gaat dus niet zozeer over welk aspect het betreft, maar over of de verandering meer te maken heeft met <strong>vaststellen, maken of afspreken (koud)</strong> of met <strong>begrijpen, beseffen of inzien (warm)</strong>.</p>

      <h4>11.3 Typering procesbenadering in verandertrajecten</h4>
      <p>De procesbenadering kan zowel koud als warm worden ingezet.</p>
      <ul>
        <li><strong>Koude benadering:</strong> gaat ervan uit dat volgens een logische aanpak alle in de voorgaande hoofdstukken beschreven stappen doorlopen worden. Alles (ontwerp en inrichting) wordt uitgewerkt op papier, inclusief competenties, houding en gedrag. Vaak wordt onderscheid gemaakt tussen een ontwerpfase, een realisatiefase en een implementatiefase. In de implementatiefase wordt betrokkenen verteld wat er van hen verwacht wordt (waarbij ze geacht worden zich, eventueel na een korte opleiding, aan te passen) en/of er worden mensen ingezet die aan die eisen en verwachtingen kunnen voldoen.</li>
        <li><strong>Warme benadering:</strong> gaat ervan uit dat inzicht in processen en doelstellingen een manier is om mensen te binden aan een gezamenlijke missie en doelstellingen. Mensen worden verleid om voortdurend te proberen dingen beter te doen, beter samen te werken en zichzelf te ontwikkelen, gericht op optimale waardecreatie voor klanten. Daarbij doorlopen individuen en groepen leerprocessen. Mensen moeten eerst zelf willen leren; het kan daarbij handig zijn dingen te meten of vast te leggen.</li>
      </ul>
      <p>Het boek benadrukt dat mensen <strong>sociale wezens</strong> zijn: het is een illusie te denken dat ze ieder voor zich rationele keuzes maken, want ieder gedrag is een antwoord op het handelen van andere mensen ("de mens is een kuddedier"). De essentie van organisaties is veel meer de sociale netwerken waaruit ze bestaan dan de proces- of andere modellen. Goed gekozen en ontworpen modellen kunnen wel een rol spelen bij het "richten van de kudde". <strong>Boodschap:</strong> een succesvol verandertraject richting procesgericht organiseren bevat zowel koude als warme elementen — mensen moeten gemotiveerd zijn en zich verbonden voelen, maar er moeten ook heldere afspraken zijn over verantwoordelijkheden en eisen. De kunst is de goede mix te vinden: een slimme afwisseling tussen warme en koude elementen.</p>

      <h4>11.4 Algemene succesfactoren voor veranderen</h4>
      <p>Binnen het vakgebied organisatieverandering is er behoorlijke consensus over de meest genoemde succesfactoren:</p>
      <ol>
        <li><strong>Urgentie en belang moeten duidelijk zijn.</strong> Er is voldoende externe druk nodig die ook daadwerkelijk gevoeld wordt; pas dan komt er actie. Dreigende of werkelijke pijn is soms een sterkere prikkel dan een mooie droom over de toekomst. De combinatie is het meest effectief: een visie op de toekomst én een idee over het vermijden van dreigende pijn door een andere weg in te slaan.</li>
        <li><strong>Aandacht en commitment van het (top)management.</strong> Het management moet de kar trekken en de vertaler zijn binnen de organisatie; zonder betrokkenheid is het geheel gedoemd te mislukken. Laat het management ook aandacht besteden aan wat al wel goed is. Belangrijker dan toespraakjes, memo's of nieuwsbrieven is de <strong>voorbeeldrol</strong> van het management.</li>
        <li><strong>Maak weerstand productief.</strong> Bij elke verandering is weerstand: een natuurlijke afweer tegen aantasting van een bekende, veilige situatie. In organisaties helpt weerstand voorkomen dat met ieder nieuw idee meteen aan de slag wordt gegaan. De kunst is weerstand om te zetten in energie. Mensen zetten zich schrap omdat ze daar een goede reden voor hebben; miskenning van loyaliteit leidt vaak tot regressief, opstandig gedrag. Duwen en trekken is een valkuil: er geldt de interactieregel "Je krijgt wat je oproept." Een beter motto is <strong>Don't push the river</strong>: zoek ruimte om door te vragen naar de reden van de onwil en probeer te achterhalen wat iemand wél wil. Vraag je af wat de functie van de weerstand is en welke boodschap erin verwoord wordt. Nieuwsgierigheid naar de verhalen en emoties biedt ruimte voor gesprek; de kernvraag is hoe deze betrokkenheid goed benut kan worden ten gunste van het veranderingsproces.</li>
      </ol>

      <h4>11.5 Het belang van het vergroten van leervermogen</h4>
      <p>In hoofdstuk 2 is beschreven dat organisaties met een hoog niveau van procesvolwassenheid een cultuur van procesgericht werken en verbeteren hebben. Veranderen en verbeteren zijn dan een permanente vaardigheid. Veranderdrijvers zoals <strong>Toyota</strong> en <strong>Southwest Airlines</strong> hebben laten zien dat het mogelijk is bewerkprocessen heel nauw te verbinden met leerprocessen: werkprocessen zijn zo ontworpen dat problemen meteen aan het licht komen en aangepakt worden, en een oplossing wordt systematisch toegepast. Managers ontwikkelen en stimuleren hun medewerkers permanent om verbeteringen te bedenken en toe te passen.</p>
      <p><strong>"Leren"</strong> is het centrale begrip: het vermogen om te kunnen leren is een voorwaarde om op een goede manier te kunnen veranderen. Mensen zijn van nature nieuwsgierig; als mensen niet meer leren, is er een reden waarom zij deze behoefte zijn kwijtgeraakt. Als mensen willen en kunnen leren en daartoe in de gelegenheid worden gesteld, verandert de organisatie continu, doordat intern en extern afstemming ontstaat. Leren moet niet in enge zin worden opgevat als het zich eigen maken van leerstof, maar duidt op het vermogen van mensen om zich telkens te blijven vernieuwen. Als iedereen in de organisatie leert leren, bereikt de organisatie haar maximale leer- en dus veranderingsvermogen.</p>

      <h4>11.6 Speciale aandacht voor veranderingen op managementniveau</h4>
      <p>In de praktijk blijkt dat (top)management meestal niet geneigd is BPM-initiatieven spontaan te ondersteunen. Een reden: in de meeste managementopleidingen krijgen processen weinig aandacht. Vooral in MBA-opleidingen staat de <strong>functionele benadering</strong> centraal; vakgebieden als strategisch management, marketing, ICT en vooral financieel management krijgen uitgebreid aandacht. Processen komen alleen aan de orde bij operationeel management (procesanalyse om productieprocessen efficiënter te maken) of bij financial control (om aan regelgeving te voldoen). Dat procesmanagement een managementfilosofie en veranderinstrument is, hebben de meeste managers niet meegekregen.</p>
      <p>Soms is er niet veel anders op te zitten dan te wachten op een verlichte geest in het topmanagement die de <em>power of processes</em> ontdekt. Alternatief is om vanuit de BPM-deskundigheid het topmanagement te laten inzien hoe weinig traditionele reorganisaties opleveren in vergelijking met goed geleide en gemanagede procesmanagementinitiatieven (een "hefboomeffect"). Dit is geen eenvoudige opgave. Drie algemene do's en don'ts:</p>
      <ol>
        <li><strong>Probeer het management niet vanuit het niets te overtuigen</strong> van het belang van een organisatiebreed procesverbeteringsprogramma. Sluit aan bij problemen of doelstellingen die al hoog op de managementagenda staan, zoals problemen die direct te herleiden zijn tot een noodzaak tot procesverbetering (te lage klanttevredenheid, te weinig afstemming tussen afdelingen).</li>
        <li><strong>Wacht het goede moment af.</strong> Bouw aan je eigen competenties en die van je team en zorg voor goede resultaten bij kleinere verbetertrajecten. Dan ben je klaar als het moment daar is om naar voren te stappen voor een organisatiebreed initiatief.</li>
        <li><strong>Besef dat managers gevoelig zijn voor hypes</strong>, want ze zijn bang achter te blijven op concurrenten. Een fancy etiket kan helpen om aandacht te krijgen. Dus of het management nu aankomt met Six Sigma, lean service, businessarchitectuur, workflowmining, INK of SOx: omarm het als kans om BPM als managementfilosofie tot leven te brengen.</li>
      </ol>

      <h4>11.7 Elementen van een procesgericht verandertraject</h4>
      <p>De procesbenadering biedt goede aanknopingspunten voor een organisatieveranderingstraject. Zij stelt dat niet één organisatieaspect als uitgangspunt genomen moet worden, maar dat het noodzakelijk is dat de verschillende elementen goed op elkaar worden afgestemd. Daarbij vormen <strong>klantgeoriënteerde processen de kapstok</strong>. De procesbenadering zorgt in de eerste plaats voor een klantgeoriënteerde bedrijfsstrategie (op welke behoefte van welke klanten richt de organisatie zich), waaruit product-marktcombinaties voortvloeien. Op basis daarvan worden voortbrengings- of bedrijfsprocessen gedefinieerd: processen waarin waarde wordt toegevoegd en waar klanten voor willen betalen. Die processen worden ingericht en zo nodig aangepast vanuit de voortdurende afstemming van de strategie met de omgeving. Parallel daaraan doorlopen organisatie en individuen leer- en ontwikkelprocessen.</p>
      <p>Harde doelen (optimale economische waarde, hogere omzet, lagere kosten, meer aandeelhouderswaarde) worden gecombineerd met doelen gericht op het uitbreiden van de capaciteiten van mensen. Het gaat erom mensen bewust te maken van hoe ze hun eigen of teambijdrage kunnen vergroten, en <strong>meten is hierbij een krachtig wapen</strong>. Veranderingsprocessen lijken op coachingsprocessen: medewerkers wordt een spiegel voorgehouden met feiten over hun eigen werkproces en zij formuleren zelf acties om verbeteringen door te voeren. Dat is zeker niet soft: bij een ontwikkelaanpak hoort dat problemen niet uit de weg worden gegaan, maar dat confrontaties, ook persoonlijke, juist worden aangegaan.</p>
      <p><strong>Tabel 11.1: koude en warme elementen in een procesgericht verandertraject</strong> (alles onder de noemer van missie, visie, strategie en positionering):</p>
      <ul>
        <li><strong>Koude veranderelementen:</strong> opstellen bedrijfsprocesmodel; uitwerken procesarchitectuur; uitwerken inrichtingsaspecten; implementeren aangepaste systemen; doorvoeren wijzigingen in taken en verantwoordelijkheden; aanpassen besturing en beheersmaatregelen.</li>
        <li><strong>Warme veranderelementen:</strong> binding aan missie en doelen, begrip dat daarvoor verandering nodig is en de daarop gebaseerde wens om zelf te leren; overtuiging dat de inrichting bijdraagt aan het behalen van doelen; (gefaciliteerd) doorlopen van individuele en collectieve leerprocessen; verder bouwen aan gewenste (verbeter)cultuur en passend leiderschap.</li>
      </ul>
      <p><strong>Essentie:</strong> verandering is een leerproces. Warm is niet: mensen betrekken bij de koude kant, maar een leerproces op gang brengen, verbondenheid met missie en doelstellingen creëren en besef van "wat betekent mijn bijdrage". Elementen aan de koude kant zijn randvoorwaardelijk of ondersteunend aan het daadwerkelijke leer- en veranderproces.</p>
      <p>Hoewel tabel 11.1 een einde zou kunnen suggereren, is veranderen in een procesgericht verandertraject <strong>een continu proces dat nooit meer ophoudt</strong>. Een grootschalige ingreep is een teken dat te weinig aandacht is geweest voor voortdurend verbeteren. Procesgericht denken en veranderen gaat ervan uit dat een voortdurende alertheid op verbetermogelijkheden veel wenselijker is dan eens in de zoveel jaar grootscheeps veranderen. Dat voortdurend "knutselen" aan de organisatie hoeft niet marginaal te zijn: het kan vanuit een langetermijnvisie waarin de organisatie er heel anders uitziet dan nu. Om dat eindplaatje te bereiken hoeft niet alles ineens te veranderen, dat kan stap voor stap, terwijl het ideaalbeeld regelmatig opnieuw wordt bekeken en bijgesteld.</p>

      <h4>11.8 Praktische invulling: procesportfoliomanagement</h4>
      <p>Trekkers van procesmanagement gebruiken steeds vaker ideeën uit het vakgebied programmamanagement om sturing te geven aan procesgericht veranderen. Daarbij hoort het idee van <strong>procesportfoliomanagement</strong> als basis voor een veranderagenda. Vanuit een procesarchitectuur is vaak af te leiden welke processen er ingrijpend gaan veranderen; de vraag is dan in welke volgorde en welk tempo. Procesportfoliomanagement helpt daarbij door alle werkprocessen als een portfolio te beheren. Aan de hand van prestatie-indicatoren per proces valt te bepalen in welke processen het grootste verbeterpotentieel zit. Vervolgens zorg je ervoor dat:</p>
      <ul>
        <li>schaarse verandercapaciteit wordt gericht op de plekken waar deze het meeste oplevert;</li>
        <li>alle betrokkenen overzicht blijven houden van het totale kader waarbinnen een bepaald proces wordt aangepakt;</li>
        <li>je voorkomt dat je het ene proces optimaliseert en daarmee een ander proces suboptimaliseert.</li>
      </ul>

      <h4>11.9 Succesfactoren toegepast op een procesgericht verandertraject</h4>
      <p><strong>11.9.1 Communiceren doe je nooit te veel.</strong> Communicatie is een van de belangrijkste dingen om het ontwikkelproces aan de warme kant te stimuleren; er wordt eigenlijk nooit te veel gecommuniceerd, maar wel moet je nadenken over de goede boodschap op het goede moment via het juiste medium. Wees je bewust van de <strong>kracht van taal</strong>: taalgebruik is een belangrijke uiting van de organisatiecultuur, en door bewust andere woorden te kiezen stuur je het denken in een bepaalde richting. Voorbeeld: energiebedrijven spraken vroeger over "verbruikers"; door over "klanten" te gaan spreken werd ook de boodschap overgebracht dat het primaire bestaansrecht niet meer was gas en elektra via kabels en leidingen veilig naar de goede plek te brengen, maar toegevoegde waarde te leveren aan degenen die de rekening betalen. Denk daarom goed na over het etiket dat je meegeeft aan initiatieven: de term "proces" kan associaties oproepen, bijvoorbeeld dat er veel op papier wordt uitgewerkt of voorgeschreven waar niets mee gedaan wordt, waardoor de eigen vrijheid minder wordt. Kies dan liever een naam die benadrukt wat de achterliggende doelen zijn, bijvoorbeeld door de term "klant" te gebruiken.</p>
      <p><strong>11.9.2 Omgaan met belangen.</strong> Voor commitment is het belangrijk te weten welk deel van de organisatie de meeste invloed heeft bij besluiten (marketing, sales of de controllers); die invloed is vaak te verklaren vanuit het verleden. Vertegenwoordigers van deze groep kunnen iets te verliezen hebben, al zijn ze zich daar misschien niet van bewust. Vijf specifieke aandachtspunten:</p>
      <ol>
        <li><strong>Maak urgentie en belang duidelijk.</strong> Het voelen dat een verandering nodig is, ontstaat niet door het te vertellen. Zoek andere vormen van communicatie, bijvoorbeeld een gefilmd klantverhaal of een indringend verhaal over een vergelijkbare organisatie die in problemen is gekomen door het onvermogen tijdig te veranderen. Vertaal de gewenste verandering naar individueel niveau: "Wat betekent het voor jou dat we klantgerichter moeten gaan worden? Met welke veranderingen krijg jij te maken?"</li>
        <li><strong>Erken (persoonlijke) belangen, ontken ze niet.</strong> Over belangen van individuen wordt meestal niet openlijk gesproken, terwijl erkenning heel belangrijk is. Het gaat om <strong>materiële belangen</strong> (een baan die mogelijk op de tocht staat, carrièremogelijkheden die verdwijnen, dwangposities als gekozen moet worden voor een andere functie) en <strong>immateriële belangen</strong> (doorbroken samenwerkingsverbanden, externe contacten zoals met leveranciers, verlies aan zekerheden of aan status). Dit geldt niet alleen voor medewerkers: zeker voor managers die gewend zijn aan sturen op basis van hiërarchie, informatiemacht en het aantal medewerkers waaraan leiding wordt gegeven, kan procesgericht denken bedreigend zijn.</li>
        <li><strong>Durf opvattingen bespreekbaar te maken.</strong> Het probleem bij vernieuwing is vaak niet hoe je nieuwe ideeën in je hoofd krijgt, maar hoe je de oude eruit krijgt. De jarenlang bekrachtigde denkwijze over de markt en de wijze van organiseren vormt vaak een grotere bedreiging dan de concurrentie. Leg een koppeling naar de (nieuwe) visie en doelstellingen en vraag mensen mee te denken: zullen de huidige opvattingen nog werken in de nieuwe situatie?</li>
        <li><strong>Maak samenhang zichtbaar.</strong> De logische samenhang tussen de keuzes moet ook ervaren worden: alle veranderingen bewegen in dezelfde richting, versterken elkaar en worden in woord, daad en houding gesteund door het management. De externe uitstraling moet kloppen met de interne identiteit (principes die naar buiten worden verkondigd, zoals "duurzaamheid" of "onze medewerkers zijn ons belangrijkste kapitaal", moeten ook intern worden waargemaakt). Om geloofwaardig te zijn en de organisatie mee te krijgen in de omslag naar een cultuur van continue verbetering moeten leiders handelen naar wat ze zeggen en zich gedragen naar wat zij als gewenste cultuur beschouwen.</li>
        <li><strong>Besef: veranderen kan iemand alleen zelf.</strong> Mensen hebben in de regel geen principieel bezwaar tegen veranderen, maar willen er wel invloed op uitoefenen: "Mensen willen wel veranderen, maar niet veranderd worden." Veranderen kan alleen door zelf een leerproces door te maken, via betrokkenheid bij de verandering. Betrokkenheid kan gecreëerd worden door gebruik te maken van kennis en inzichten die mensen hebben van de oude en de nieuwe situatie. Medewerkers weten vaak beter dan wie ook hoe de huidige processen lopen, waar de echte knelpunten zitten en welke oplossingsmogelijkheden er zijn; ze zijn ook prima in staat oplossingsalternatieven die door anderen worden aangedragen op hun merites te beoordelen.</li>
      </ol>
      <p><strong>11.9.3 De BPM-professional als veranderaar.</strong> Om te komen tot een procesgerichte(re) organisatie zullen zeker in de eerste fase, als voortdurend veranderen nog niet vanzelfsprekend is, regelmatig veranderprogramma's of -projecten worden opgestart. Van BPM-professionals wordt gevraagd hierbij als verandermanager of <strong>change-agent</strong> op te treden. Je zorgt dat mensen goed zijn toegerust, besteedt veel aandacht aan communicatie, opleiding, coaching en begeleiding, en kiest voor een (zo veel mogelijk) persoonlijke aanpak. Belangrijk is te zoeken naar interventies die de passie en emotie aanspreken, niet alleen de ratio; alleen informatie delen is onvoldoende. Het mooie bij procesgericht veranderen en verbeteren is dat het logisch en vanzelfsprekend is dat mensen worden betrokken bij de inhoudelijke organisatieveranderingen. Omdat zo'n verandertraject een warme en een koude kant heeft, moet je als veranderaar kunnen schakelen tussen verschillende rollen.</p>

      <h4>11.10 Specifieke interventies in procesgerichte veranderprocessen</h4>
      <p>Veranderen richting een procesgerichte organisatie kent voor een groot deel dezelfde succesfactoren als andere integrale veranderingsprocessen, maar een aantal interventies en benaderingen kan juist in zo'n veranderproces goed werken.</p>
      <p><strong>11.10.1 Krachtige interventie 1: de 5-5-methode</strong> (doelen vertalen naar concreet gedrag), in drie stappen:</p>
      <ol>
        <li><strong>Benoemen van relevant gedrag.</strong> Bepaal een onderwerp, de centrale vraag (bijvoorbeeld: wat is kenmerkend voor klantgerichtheid?). Geef elke deelnemer vijf blaadjes voor effectieve en vijf voor ineffectieve situaties en vraag per blad een situatie te beschrijven waarin hijzelf of iemand anders klantgericht handelde, en idem voor situaties waarin juist niet klantgericht werd gehandeld. Help deelnemers eventueel op weg met een voorbeeld. Op beide formulieren staan twee onderdelen: 1. gedrag/situatie en 2. gevolgen/effecten.</li>
        <li><strong>Verhelderen van relevante aspecten.</strong> Laat deelnemers om de beurt een situatie voorlezen en vraag: "Van welk aspect van klantgerichtheid is dit een voorbeeld?" (bijvoorbeeld: luisteren naar wensen, proactief aangeven mogelijkheden, tijdig informeren). Schrijf de genoemde categorie boven aan een flap. Vraag welke deelnemer een incident heeft opgeschreven dat bij dezelfde categorie hoort; ook dat wordt voorgelezen, besproken en toegevoegd aan een bestaande of nieuwe categorie. Belangrijk is dat de situaties zo concreet mogelijk worden: bij vage omschrijvingen wordt doorgevraagd tot iedereen de situatie voor zich kan zien.</li>
        <li><strong>Maken van beoordelingsschaal.</strong> Trek op iedere flap (dus per categorie) een verticale lijn met een schaalverdeling van 1 tot 10. Orden samen met de groep per categorie de situaties: bij nummer 1 komt het meest effectieve gedrag, bij nummer 10 het minst effectieve gedrag. Als alle incidenten van een categorie zijn gerangschikt, kan de groep eventueel nog incidenten bedenken voor de lege plekken op de schaal.</li>
      </ol>
      <p><strong>11.10.2 Krachtige interventie 2: (proces)gaming.</strong> Het inzetten van gaming is heel geschikt om de procesgerichtheid van organisaties te vergroten. In Nederland zijn veel verschillende procesgames beschikbaar, vaak ontwikkeld door of samen met adviesbureaus. Belangrijke succesfactor: goed nadenken over de doelstellingen die je ermee wilt bereiken en over hoe je na de inzet van de game verdergaat met de verworven inzichten.</p>
      <p><strong>11.10.3 Krachtige interventie 3: losdenken.</strong> Bij organisaties die de basis voor procesgerichtheid op orde hebben, verschuift op weg naar een hoger volwassenheidsniveau de aandacht van <em>beheersen</em> naar <em>verbeteren en innoveren</em>. Dan is het regelmatig nodig bestaande patronen van denken en doen te doorbreken. Daarvoor is het belangrijk de competentie <strong>"circulair denken"</strong> (eenvoudiger: "losdenken") binnen de organisatie te ontwikkelen. Dit staat tegenover <strong>lineair denken</strong>: denken in termen van actie-reactie, oorzaak-gevolg en probleem-oplossing. Een organisatie als sociaal systeem in interactie met haar omgeving is veel ingewikkelder dan dat: er is vaak een ingewikkelde samenhang tussen allerlei dingen met een eigen dynamiek. Een eenvoudig voorbeeld: er gaat veel fout, dus er moet veel tijd besteed worden aan het oplossen van fouten, waardoor er weinig tijd is om dingen goed te doen, waardoor er veel fout gaat, enzovoort. Het gaat er dan niet om wie de schuldige is, maar om hoe een ongewenste situatie in stand wordt gehouden. Eén verklaring is vaak onvoldoende; het gaat om verklaringen vanuit verschillende posities, want mensen hebben vaak goede intenties bij acties die door anderen als negatief worden ervaren.</p>
      <p>Een signaal dat anders kijken zinvol is: iedereen doet zijn best, maar problemen komen telkens terug (soms in een iets andere gedaante). Dan kunnen pogingen om het probleem op te lossen indirect bijdragen aan het vergroten ervan, of kleine dingen een groter, zelfversterkend proces in gang zetten. Een effectieve manier is om de patronen te <strong>tekenen</strong> als positieve (versterkende) of negatieve (afzwakkende) relaties tussen elementen, in de vorm van pijlen met een plus of min: <strong>feedbackloops</strong>. Daarmee kan (liefst met betrokkenen) worden besproken welke (deel)patronen wel of niet functioneel zijn en al dan niet helpen om gezamenlijke doelen te bereiken. Voorbeeld van een disfunctioneel patroon: escalatie van een conflict (naarmate de ander bozer wordt, word ik ook steeds bozer). Het kan ook positief werken: een goedlopend product genereert geld, waarmee het product verbeterd kan worden, waardoor het nog beter gaat lopen. Veelvoorkomende typerende patronen heten <strong>archetypen</strong>:</p>
      <ul>
        <li><strong>Lapmiddelen:</strong> door het symptoom te bestrijden wordt het probleem alleen maar groter.</li>
        <li><strong>Grenzen aan de groei:</strong> groei creëert op den duur zijn eigen belemmeringen.</li>
        <li><strong>Afglijdende normen:</strong> door de norm te verlagen lijkt verdere actie niet meer nodig.</li>
        <li><strong>Succes voor de succesvollen:</strong> middelen worden vooral gegeven aan bewezen succesvolle activiteiten, waardoor nieuwe activiteiten geen kans krijgen.</li>
      </ul>
      <p><strong>Figuur 11.1 Lapmiddelenpatroon:</strong> het optreden van het probleem leidt tot het inzetten van lapmiddelen, wat onbedoelde effecten heeft die het probleem alleen maar verergeren. Voorbeeld: als "de baas" er telkens voor zorgt dat problemen (bij klanten) worden opgelost, gaan medewerkers achterover leunen. Dit versterkt de problemen juist. Het lapmiddelenpatroon komt veel voor als processturing gericht is op beheersing en het oplossen van fouten achteraf.</p>
      <p>Een ander typisch patroon, zeer relevant voor procesgericht organiseren, is de <strong>controlefeedbacklus</strong>. Die ontstaat als managers het gevoel krijgen dat de organisatie niet meer in control is. Als reactie voeren ze extra controle- en verantwoordingsmaatregelen in. Effect: medewerkers raken gedemotiveerd en gaan minder presteren. Gevolg: managers hebben nog sterker het gevoel dat de organisatie niet in control is en nemen nog meer maatregelen, enzovoort.</p>
      <p>Belangrijker dan zelf leren plaatjes tekenen is ervoor te zorgen dat dit soort inzichten gedeeld worden door de betrokkenen, bijvoorbeeld als groep of team (in het begin waarschijnlijk met behulp van een procesbegeleider) samen patronen ontdekken. Dan blijkt het vaak relatief eenvoudig om een verbetering of ingreep te bedenken die tot een structurele verbetering van de situatie leidt. Volgens de ervaring van de auteurs kunnen zelfs hele organisaties, groepen, teams of afdelingen die al lang worstelen met telkens terugkerende problemen of conflicten met deze aanpak vaak verrassend snel grote doorbraken bereiken.</p>

      <h4>11.11 Conclusie</h4>
      <p>Voor procesgericht organiseren is het belangrijk dat er een bedrijfsprocesmodel en een procesarchitectuur zijn en dat alle organisatieaspecten procesgericht zijn ingericht. Dat is al behoorlijk lastig. Wat echt moeilijk is, zijn de bijbehorende veranderprocessen, gericht op een andere houding, andere manieren van samenwerking en ander leiderschap. Om dat voor elkaar te krijgen zijn veranderkundige inzichten en interventies nodig. Dit hoofdstuk gaf aan hoe het denken in termen van koude en warme veranderingen hierbij kan helpen, wat de belangrijkste succesfactoren zijn en hoe deze worden toegepast op procesgericht organiseren.</p>
      <ul>
        <li><strong>Aan de koude kant</strong> (het ontwerpen en vastleggen van processen en alles wat daarbij hoort) zijn belangrijke succesfactoren: <strong>van buiten naar binnen</strong> (gebaseerd op circulair denken, dat ervan uitgaat dat een organisatie voortdurend in afstemming is met haar omgeving), <strong>integraal</strong> (een organisatie als doelgericht samenwerkingsverband vraagt om het in samenhang kijken naar verschillende invalshoeken) en <strong>iteratief</strong> (het hoeft niet in één keer goed, maar het moet wel een goede stap de goede kant op gaan).</li>
        <li><strong>Aan de warme kant</strong> (leerprocessen die mensen doormaken) zijn onder andere belangrijk: <strong>verbinden</strong> (mensen met elkaar, met visie en doelstellingen, en met de verandering), <strong>delen</strong> (informatie, kennis en ervaringen, zodat een gemeenschappelijke ambitie ontstaat) en <strong>eigenaarschap</strong> (verantwoordelijkheid dragen voor de eigen bijdrage).</li>
      </ul>

/* ============================================================
   STATE / STORAGE
   ============================================================ */
const STORAGE_KEY = 'bpmLeerapp_attempts_v1';

function loadAttempts() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function saveAttempt(attempt) {
  try {
    const all = loadAttempts();
    all.push(attempt);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
  } catch (e) { /* storage unavailable, continue silently */ }
}

function allQuestions() {
  return CHAPTERS.flatMap(c => c.questions.map(q => ({...q, chapterId: c.id, chapterTitle: 'Hoofdstuk ' + c.number})));
}
function chapterById(id) { return CHAPTERS.find(c => c.id === id); }

function chapterStats(chapterId) {
  const attempts = loadAttempts().filter(a => a.type === 'oefentoets' && a.chapterId === chapterId && !a.retry);
  if (!attempts.length) return null;
  const last = attempts[attempts.length - 1];
  return { attempts: attempts.length, lastPct: Math.round(100 * last.correctCount / last.total) };
}

function topicStats() {
  const attempts = loadAttempts();
  const map = {};
  attempts.forEach(a => {
    (a.perQuestion || []).forEach(pq => {
      if (!map[pq.topic]) map[pq.topic] = {correct:0, total:0};
      map[pq.topic].total++;
      if (pq.correct) map[pq.topic].correct++;
    });
  });
  return map;
}

/* ============================================================
   ROUTER / NAV
   ============================================================ */
let route = { view: 'dashboard' };

function go(newRoute) {
  route = newRoute;
  render();
  window.scrollTo({top:0, behavior:'instant'});
  closeSidebarMobile();
}

function renderNav() {
  const nav = document.getElementById('navlist');
  nav.innerHTML = '';

  nav.appendChild(navItem('🏡 Dashboard', route.view === 'dashboard', () => go({view:'dashboard'})));

  CHAPTERS.forEach(ch => {
    const groupOpen = route.view !== 'dashboard' && route.view !== 'tentamen' && route.view !== 'voortgang' && route.chapterId === ch.id;
    const group = document.createElement('div');
    group.className = 'nav-chapter-group';
    const head = document.createElement('button');
    head.className = 'nav-chapter-head' + (groupOpen ? ' open' : '');
    head.innerHTML = `<span>📘 Hoofdstuk ${ch.number}</span><span class="chev">▶</span>`;
    head.onclick = () => {
      if (groupOpen) { go({view:'dashboard'}); }
      else { go({view:'samenvatting', chapterId: ch.id}); }
    };
    group.appendChild(head);
    const sub = document.createElement('div');
    sub.className = 'nav-sub' + (groupOpen ? ' open' : '');
    sub.appendChild(navItem('📝 Samenvatting', route.view==='samenvatting' && route.chapterId===ch.id, () => go({view:'samenvatting', chapterId: ch.id})));
    sub.appendChild(navItem('🌸 Infographic', route.view==='infographic' && route.chapterId===ch.id, () => go({view:'infographic', chapterId: ch.id})));
    sub.appendChild(navItem('✏️ Oefentoets', route.view==='oefentoets-setup' && route.chapterId===ch.id, () => go({view:'oefentoets-setup', chapterId: ch.id})));
    group.appendChild(sub);
    nav.appendChild(group);
  });

  nav.appendChild(navItem('🎓 Tentamen', route.view === 'tentamen-setup' || route.view==='tentamen', () => go({view:'tentamen-setup'})));
  nav.appendChild(navItem('🌷 Mijn voortgang', route.view === 'voortgang', () => go({view:'voortgang'})));
}

function navItem(label, active, onClick) {
  const b = document.createElement('button');
  b.className = 'nav-item' + (active ? ' active' : '');
  b.textContent = label;
  b.onclick = onClick;
  return b;
}

function openSidebarMobile() { document.getElementById('sidebar').classList.add('open'); }
function closeSidebarMobile() { document.getElementById('sidebar').classList.remove('open'); }
document.getElementById('sidebarToggle').onclick = () => {
  document.getElementById('sidebar').classList.toggle('open');
};

/* ============================================================
   RENDER: MAIN
   ============================================================ */
function render() {
  renderNav();
  const el = document.getElementById('content');
  el.innerHTML = '';
  if (route.view === 'dashboard') renderDashboard(el);
  else if (route.view === 'samenvatting') renderSummary(el, route.chapterId);
  else if (route.view === 'infographic') renderInfographic(el, route.chapterId);
  else if (route.view === 'oefentoets-setup') renderQuizSetup(el, {mode:'oefentoets', chapterId: route.chapterId});
  else if (route.view === 'tentamen-setup') renderQuizSetup(el, {mode:'tentamen'});
  else if (route.view === 'quiz') renderQuiz(el);
  else if (route.view === 'results') renderResults(el);
  else if (route.view === 'voortgang') renderVoortgang(el);
}

      <button class="btn" id="toInfo">Bekijk infographic 🌸</button>
      <button class="btn secondary" id="toQuiz">Start oefentoets ✏️</button>
    </div>
  `;
  el.querySelector('#toInfo').onclick = () => go({view:'infographic', chapterId});
  el.querySelector('#toQuiz').onclick = () => go({view:'oefentoets-setup', chapterId});
}

/* ---------- Infographic ---------- */
function renderInfographic(el, chapterId) {
  const ch = chapterById(chapterId);
  el.innerHTML = `
    <div class="page-eyebrow">Hoofdstuk ${ch.number} · Infographic</div>
    <h2 class="page-title">Visueel overzicht</h2>
    <p class="page-sub">${ch.subtitle}</p>
    <div id="infoBody"></div>
  `;
  const body = el.querySelector('#infoBody');
  if (ch.infographicKey === 'h1') body.appendChild(buildH1Infographic());
  if (ch.infographicKey === 'h2') body.appendChild(buildH2Infographic());
  if (ch.infographicKey === 'h3') body.appendChild(buildH3Infographic());
  if (ch.infographicKey === 'h4') body.appendChild(buildH4Infographic());
  if (ch.infographicKey === 'h6') body.appendChild(buildH6Infographic());
  if (ch.infographicKey === 'h7') body.appendChild(buildH7Infographic());
  if (ch.infographicKey === 'h11') body.appendChild(buildH11Infographic());
  const nav = document.createElement('div');
  nav.style.cssText = 'display:flex; gap:12px; flex-wrap:wrap; margin-top:8px;';
  nav.innerHTML = `<button class="btn secondary" id="backSum">← Terug naar samenvatting</button><button class="btn" id="toQuiz2">Start oefentoets ✏️</button>`;
  el.appendChild(nav);
  el.querySelector('#backSum').onclick = () => go({view:'samenvatting', chapterId});
  el.querySelector('#toQuiz2').onclick = () => go({view:'oefentoets-setup', chapterId});
}
